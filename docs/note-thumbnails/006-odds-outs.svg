    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#2a3828;stop-opacity:0"/><stop offset="20%" style="stop-color:#c9a84c;stop-opacity:0.6"/><stop offset="80%" style="stop-color:#c9a84c;stop-opacity:0.6"/><stop offset="100%" style="stop-color:#2a3828;stop-opacity:0"/></linearGradient>
