<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="670" viewBox="0 0 1280 670">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1009"/>
      <stop offset="50%" style="stop-color:#131a14"/>
      <stop offset="100%" style="stop-color:#0d1009"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4b965"/>
      <stop offset="100%" style="stop-color:#9a7c35"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2a3828;stop-opacity:0"/>
      <stop offset="20%" style="stop-color:#c9a84c;stop-opacity:0.6"/>
      <stop offset="80%" style="stop-color:#c9a84c;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#2a3828;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="labelBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c9a84c"/>
      <stop offset="100%" style="stop-color:#9a7c35"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="670" fill="url(#bg)"/>

  <!-- Subtle tech watermarks -->
  <text x="900" y="400" font-size="320" fill="rgba(201,168,76,0.015)" font-family="monospace">AI</text>
  <text x="100" y="550" font-size="200" fill="rgba(201,168,76,0.012)" font-family="monospace">01</text>

  <!-- Decorative border -->
  <rect x="48" y="48" width="1184" height="574" rx="4" ry="4" fill="none" stroke="#2a3828" stroke-width="1" opacity="0.5"/>

  <!-- Gold accent corners -->
  <line x1="48" y1="48" x2="128" y2="48" stroke="url(#goldGrad)" stroke-width="2"/>
  <line x1="48" y1="48" x2="48" y2="128" stroke="url(#goldGrad)" stroke-width="2"/>
  <line x1="1152" y1="48" x2="1232" y2="48" stroke="url(#goldGrad)" stroke-width="2"/>
  <line x1="1232" y1="48" x2="1232" y2="128" stroke="url(#goldGrad)" stroke-width="2"/>
  <line x1="48" y1="542" x2="48" y2="622" stroke="url(#goldGrad)" stroke-width="2"/>
  <line x1="48" y1="622" x2="128" y2="622" stroke="url(#goldGrad)" stroke-width="2"/>
  <line x1="1152" y1="622" x2="1232" y2="622" stroke="url(#goldGrad)" stroke-width="2"/>
  <line x1="1232" y1="542" x2="1232" y2="622" stroke="url(#goldGrad)" stroke-width="2"/>

  <!-- Category label badge: solid gold background -->
  <rect x="80" y="80" width="{{LABEL_W}}" height="44" rx="4" fill="url(#labelBg)" filter="url(#softShadow)"/>
  <text x="{{LABEL_X}}" y="108" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="18" font-weight="700" fill="#0d1009">{{LABEL}}</text>

  <!-- Vertical gold accent bar (left of title) -->
  <rect x="80" y="160" width="4" height="120" rx="2" fill="url(#goldGrad)"/>

  <!-- Main title (large, impactful) -->
  <text x="100" y="210" font-family="'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif" font-size="44" font-weight="700" fill="#ddd6c8" letter-spacing="-0.5">
    <tspan x="100" dy="0">{{TITLE_LINE1}}</tspan>
    <tspan x="100" dy="58">{{TITLE_LINE2}}</tspan>
  </text>

  <!-- Story hook line (key phrase in gold) -->
  <text x="100" y="360" font-family="'Noto Sans JP', sans-serif" font-size="26" font-weight="600" fill="#c9a84c">{{HOOK_LINE}}</text>

  <!-- Description -->
  <text x="100" y="410" font-family="'Noto Sans JP', sans-serif" font-size="18" fill="#7a7260">{{DESCRIPTION}}</text>

  <!-- Bottom divider -->
  <rect x="80" y="480" width="1120" height="1" fill="url(#borderGrad)"/>

  <!-- Bottom bar: personal brand -->
  <text x="80" y="540" font-family="monospace" font-size="28" fill="#c9a84c" filter="url(#glow)">&gt;_</text>
  <text x="126" y="536" font-family="'Noto Sans JP', sans-serif" font-size="18" font-weight="600" fill="#ddd6c8" letter-spacing="1">AI x Individual Dev</text>

  <!-- Bottom bar: tagline -->
  <text x="1200" y="536" text-anchor="end" font-family="'Noto Sans JP', sans-serif" font-size="14" fill="#4a5245">CEOの経験則から学ぶAI活用の実践記録</text>

  <!-- Tags -->
  <text x="80" y="600" font-family="'Noto Sans JP', sans-serif" font-size="14" fill="#9a7c35">{{TAGS}}</text>
</svg>