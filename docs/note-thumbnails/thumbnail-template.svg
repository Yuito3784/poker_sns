<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="670" viewBox="0 0 1280 670">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1009"/>
      <stop offset="50%" style="stop-color:#131a14"/>
      <stop offset="100%" style="stop-color:#0d1009"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4b965"/>
      <stop offset="100%" style="stop-color:#9a7c35"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2a3828;stop-opacity:0"/>
      <stop offset="20%" style="stop-color:#c9a84c;stop-opacity:0.6"/>
      <stop offset="80%" style="stop-color:#c9a84c;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#2a3828;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="670" fill="url(#bg)"/>

  <!-- Subtle suit watermarks -->
  <text x="100" y="350" font-size="280" fill="rgba(201,168,76,0.025)" font-family="serif">&#9824;</text>
  <text x="400" y="500" font-size="220" fill="rgba(201,168,76,0.02)" font-family="serif">&#9829;</text>
  <text x="800" y="300" font-size="260" fill="rgba(201,168,76,0.02)" font-family="serif">&#9830;</text>
  <text x="1050" y="480" font-size="240" fill="rgba(201,168,76,0.025)" font-family="serif">&#9827;</text>

  <!-- Decorative border lines -->
  <rect x="48" y="48" width="1184" height="574" rx="4" ry="4" fill="none" stroke="#2a3828" stroke-width="1" opacity="0.5"/>

  <!-- Gold accent corners -->
  <line x1="48" y1="48" x2="128" y2="48" stroke="url(#goldGrad)" stroke-width="2"/>
  <line x1="48" y1="48" x2="48" y2="128" stroke="url(#goldGrad)" stroke-width="2"/>
  <line x1="1152" y1="48" x2="1232" y2="48" stroke="url(#goldGrad)" stroke-width="2"/>
  <line x1="1232" y1="48" x2="1232" y2="128" stroke="url(#goldGrad)" stroke-width="2"/>
  <line x1="48" y1="542" x2="48" y2="622" stroke="url(#goldGrad)" stroke-width="2"/>
  <line x1="48" y1="622" x2="128" y2="622" stroke="url(#goldGrad)" stroke-width="2"/>
  <line x1="1152" y1="622" x2="1232" y2="622" stroke="url(#goldGrad)" stroke-width="2"/>
  <line x1="1232" y1="542" x2="1232" y2="622" stroke="url(#goldGrad)" stroke-width="2"/>

  <!-- Series badge (top-left) -->
  <rect x="80" y="72" width="120" height="40" rx="20" fill="rgba(201,168,76,0.15)" stroke="#c9a84c" stroke-width="1"/>
  <text x="140" y="98" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#c9a84c">
    {{SERIES}}
  </text>

  <!-- Article number (top-right) -->
  <text x="1200" y="100" text-anchor="end" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#9a7c35" letter-spacing="2">
    {{NUMBER}}
  </text>

  <!-- Gold divider line -->
  <rect x="80" y="180" width="60" height="3" rx="1.5" fill="url(#goldGrad)"/>

  <!-- Article title (main) -->
  <text x="80" y="240" font-family="'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif" font-size="44" font-weight="700" fill="#ddd6c8" letter-spacing="-0.5">
    <tspan x="80" dy="0">{{TITLE_LINE1}}</tspan>
    <tspan x="80" dy="60">{{TITLE_LINE2}}</tspan>
  </text>

  <!-- Subtitle -->
  <text x="80" y="380" font-family="'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif" font-size="22" fill="#7a7260" letter-spacing="0.5">
    {{SUBTITLE}}
  </text>

  <!-- Bottom divider -->
  <rect x="80" y="480" width="1120" height="1" fill="url(#borderGrad)"/>

  <!-- Bottom bar: brand logo -->
  <text x="80" y="560" font-family="serif" font-size="36" fill="#c9a84c" filter="url(#glow)">&#9824;</text>
  <text x="126" y="556" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="700" fill="#ddd6c8" letter-spacing="1">
    Poker SNS
  </text>

  <!-- Bottom bar: tagline -->
  <text x="1200" y="556" text-anchor="end" font-family="'Noto Sans JP', sans-serif" font-size="16" fill="#4a5245">
    ポーカーハンドを共有して、もっと上手くなる
  </text>

  <!-- Keywords / tags -->
  <text x="80" y="600" font-family="'Noto Sans JP', sans-serif" font-size="14" fill="#9a7c35">
    {{TAGS}}
  </text>
</svg>
