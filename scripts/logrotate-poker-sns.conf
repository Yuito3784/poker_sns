# /etc/logrotate.d/poker-sns
# インストール: sudo cp scripts/logrotate-poker-sns.conf /etc/logrotate.d/poker-sns

/var/log/poker_sns/*.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    create 0640 root root
    dateext
    dateformat -%Y%m%d
}

/var/log/ssl-renew.log {
    weekly
    rotate 12
    compress
    missingok
    notifempty
}
