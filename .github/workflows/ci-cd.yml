name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # ── Docs Lint ─────────────────────────────────────────────
  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Markdown files in docs/
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: "docs/**/*.md"
      - name: Check docs file naming convention
        run: |
          INVALID=$(find docs/ -name '*.md' -not -path 'docs/design/*' | grep -vE '^docs/[A-Z0-9_]+\.md$|^docs/note-templates/[a-z0-9-]+\.md$|^docs/note-thumbnails/.*|^docs/devsecops/.*' || true)
          if [ -n "$INVALID" ]; then
            echo "::warning::Non-standard file names found (expected UPPER_SNAKE.md at root or kebab-case.md in note-templates/):"
            echo "$INVALID"
          fi

  # ── Backend Tests ──────────────────────────────────────────
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test -- --forceExit
      - run: npm run build

  # ── Frontend Build ─────────────────────────────────────────
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://example.com/api
          NEXT_PUBLIC_SITE_URL: https://example.com

  # ── Build Error Notification ───────────────────────────────
  notify-build-failure:
    if: ${{ always() && (needs.backend-test.result == 'failure' || needs.frontend-build.result == 'failure') }}
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - name: Notify build failure (Discord)
        if: ${{ secrets.DISCORD_WEBHOOK_URL != '' }}
        run: |
          BACKEND_RESULT="${{ needs.backend-test.result }}"
          FRONTEND_RESULT="${{ needs.frontend-build.result }}"
          DETAILS="Backend: ${BACKEND_RESULT}, Frontend: ${FRONTEND_RESULT}"
          curl -s -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"Build FAILED\",\"description\":\"**Commit:** \`${GITHUB_SHA::7}\`\n**${DETAILS}**\n[View Run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})\",\"color\":15158332,\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}]}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}" || true

      - name: Notify build failure (Slack)
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        run: |
          BACKEND_RESULT="${{ needs.backend-test.result }}"
          FRONTEND_RESULT="${{ needs.frontend-build.result }}"
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"attachments\":[{\"color\":\"danger\",\"title\":\"Build FAILED\",\"text\":\"Commit: \`${GITHUB_SHA::7}\`\nBackend: ${BACKEND_RESULT}, Frontend: ${FRONTEND_RESULT}\n<${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}|View Run>\",\"footer\":\"poker_sns CI/CD\"}]}" || true

  # ── Docker Build & Push (main only) ────────────────────────
  docker-build:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image prefix
        run: echo "IMAGE_PREFIX=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ── Deploy to Production (main only) ───────────────────────
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [docker-build]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/poker_sns
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f

      - name: Health check
        run: |
          sleep 15
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ secrets.DEPLOY_HOST }}/api/health" || true)
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i: status=$STATUS, retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after 5 attempts"
          exit 1

      - name: Notify success (Discord)
        if: success()
        run: |
          curl -s -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"Deploy Success\",\"description\":\"poker_sns deployed: \`${GITHUB_SHA::7}\`\",\"color\":3066993}]}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}" || true

      - name: Notify success (Slack)
        if: ${{ success() && secrets.SLACK_WEBHOOK_URL != '' }}
        run: |
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"attachments\":[{\"color\":\"good\",\"title\":\"Deploy Success\",\"text\":\"poker_sns deployed: \`${GITHUB_SHA::7}\`\",\"footer\":\"poker_sns CI/CD\"}]}" || true

      - name: Notify failure (Discord)
        if: failure()
        run: |
          curl -s -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"Deploy FAILED\",\"description\":\"poker_sns deploy failed: \`${GITHUB_SHA::7}\`\nRun: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\",\"color\":15158332}]}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}" || true

      - name: Notify failure (Slack)
        if: ${{ failure() && secrets.SLACK_WEBHOOK_URL != '' }}
        run: |
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"attachments\":[{\"color\":\"danger\",\"title\":\"Deploy FAILED\",\"text\":\"poker_sns deploy failed: \`${GITHUB_SHA::7}\`\n<${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}|View Run>\",\"footer\":\"poker_sns CI/CD\"}]}" || true

      - name: Trigger auto-recovery on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'notify-and-recover.yml',
              ref: 'main',
              inputs: {
                error_stage: 'deploy',
                error_details: `Deploy failed for commit ${context.sha.substring(0, 7)}`
              }
            });
        continue-on-error: true
