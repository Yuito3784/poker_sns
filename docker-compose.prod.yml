# 本番環境用オーバーライド
# 使い方: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# このファイルは:
#   - バックエンド/フロントエンドの直接ポート露出を削除 (Nginx 経由のみ)
#   - 証明書更新のための nginx 設定を SSL 版に切り替え
#   - セキュリティ上重要な環境変数のデフォルト値を無効化
services:
  db:
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required in production}
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '2.0'

  backend:
    ports: []  # 直接アクセス不可（Nginx のみ）
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1.0'
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:?DB_PASSWORD is required}@db:5432/poker_sns
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required in production}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?STRIPE_SECRET_KEY is required}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?STRIPE_WEBHOOK_SECRET is required}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?TOKEN_ENCRYPTION_KEY is required for SNS auto-post}

  frontend:
    ports: []  # 直接アクセス不可（Nginx のみ）
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1.0'

  nginx:
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'
    volumes:
      - ./nginx-prod.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-conf:/etc/letsencrypt:ro
