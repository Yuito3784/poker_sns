services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: poker_sns
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI（届いたメールを確認: http://localhost:8025）

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      PORT: 3001
      # リポジトリ直下の .env の DATABASE_URL で上書き可能（未指定ならローカルDB）
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:${DB_PASSWORD:-postgres}@db:5432/poker_sns}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      API_URL: ${API_URL:-http://localhost:3001}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # 未指定時はローカル用 MailHog（docker compose で mailhog を起動している場合）
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@pokersns.com}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      LINE_CLIENT_ID: ${LINE_CLIENT_ID:-}
      LINE_CLIENT_SECRET: ${LINE_CLIENT_SECRET:-}
      X_CLIENT_ID: ${X_CLIENT_ID:-}
      X_CLIENT_SECRET: ${X_CLIENT_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}
      X_AUTOPOST_CALLBACK_BASE: ${X_AUTOPOST_CALLBACK_BASE:-}
      X_AUTOPOST_CLIENT_ID: ${X_AUTOPOST_CLIENT_ID:-}
      X_AUTOPOST_CLIENT_SECRET: ${X_AUTOPOST_CLIENT_SECRET:-}
      X_OAUTH1_CONSUMER_KEY: ${X_OAUTH1_CONSUMER_KEY:-}
      X_OAUTH1_CONSUMER_SECRET: ${X_OAUTH1_CONSUMER_SECRET:-}
      X_OAUTH1_ACCESS_TOKEN: ${X_OAUTH1_ACCESS_TOKEN:-}
      X_OAUTH1_ACCESS_SECRET: ${X_OAUTH1_ACCESS_SECRET:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - uploads:/app/uploads
    ports:
      - "3001:3001"
      - "5555:5555"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
    environment:
      INTERNAL_API_URL: http://backend:3001
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-conf:/etc/letsencrypt:ro

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    # 証明書取得: docker compose run --rm certbot certonly --webroot -w /var/www/certbot -d yourdomain.com --email your@email.com --agree-tos
    # 証明書更新: docker compose run --rm certbot renew
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"

volumes:
  pgdata:
  uploads:
  certbot-www:
  certbot-conf:
