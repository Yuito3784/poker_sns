<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; font-family: 'Noto Sans JP', sans-serif; }

    .bg {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at center, #1a3a1f 0%, #0a1a0f 50%, #050d05 100%);
    }
    .bg::after {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(34,139,34,0.08) 0%, transparent 50%);
    }

    .grain { position: absolute; inset: 0; opacity: 0.03; pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .safe { position: absolute; top: 150px; bottom: 200px; left: 60px; right: 60px; }
    .clip { position: absolute; opacity: 0; }
    .fukuro { text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000; }

    .progress-bar { position: absolute; bottom: 100px; left: 60px; right: 60px; height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px; }
    .progress-fill { height: 100%; width: 0%; background: #c9a84c; border-radius: 2px; }

    .flash { position: absolute; inset: 0; background: white; opacity: 0; pointer-events: none; z-index: 100; }

    .card-shape {
      display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
      width: 160px; height: 220px; background: #1a1a1a; border: 3px solid #444;
      border-radius: 12px; margin: 0 20px;
    }

    .fold-stamp {
      color: #FF3B3B; font-size: 80px; font-weight: 900;
      border: 6px solid #FF3B3B; padding: 8px 24px; border-radius: 8px;
      transform: rotate(-15deg); opacity: 0;
    }

    .board-card {
      display: inline-block; background: #222; border: 2px solid #555;
      border-radius: 8px; padding: 12px 18px; margin: 0 8px;
      font-size: 44px; font-weight: 700; opacity: 0;
    }
  </style>
</head>
<body>
<div id="root" data-composition-id="v2-reel-06" data-start="0" data-duration="15" data-width="1080" data-height="1920">
  <div class="bg"></div>
  <div class="grain"></div>
  <div class="flash" id="flash1"></div>
  <div class="safe">

    <!-- HOOK 0-3s -->
    <div class="clip" id="hook" data-start="0" data-duration="3" data-track-index="0">
      <div style="position:absolute; top:80px; left:0;">
        <div style="color:#fff; font-size:44px; font-weight:700;">フォールドした後の</div>
        <div style="color:#fff; font-size:44px; font-weight:700; margin-top:10px;">ボード見た時の</div>
        <div id="hook-impact" style="color:#FFE136; font-size:80px; font-weight:900; transform:rotate(-2deg); margin-top:20px;" class="fukuro">絶望感ｗｗｗ</div>
      </div>
      <div style="position:absolute; top:40px; right:20px; font-size:80px; transform:rotate(12deg);">💀</div>
    </div>

    <!-- HERO HAND 3-5.5s -->
    <div class="clip" id="hero-hand" data-start="3" data-duration="2.5" data-track-index="0">
      <div style="position:absolute; top:300px; left:0; right:0; text-align:center;">
        <div style="display:inline-flex; align-items:center; gap:40px;">
          <div class="card-shape" id="card1">
            <span style="color:#fff; font-size:56px; font-weight:900;">7</span>
            <span style="color:#fff; font-size:44px;">&#9824;</span>
          </div>
          <div class="card-shape" id="card2">
            <span style="color:#FF3B3B; font-size:56px; font-weight:900;">2</span>
            <span style="color:#FF3B3B; font-size:44px;">&#9830;</span>
          </div>
        </div>
        <div style="margin-top:40px;">
          <div class="fold-stamp" id="fold-stamp">FOLD</div>
        </div>
      </div>
    </div>

    <!-- BOARD REVEAL 5.5-9.5s -->
    <div class="clip" id="board" data-start="5.5" data-duration="4" data-track-index="0">
      <div style="position:absolute; top:160px; left:0;">
        <div style="color:#888; font-size:28px;">ボード：</div>
      </div>
      <div style="position:absolute; top:240px; left:0; right:0; text-align:center;">
        <span class="board-card" id="bc1" style="color:#FF3B3B;">7&#9829;</span>
        <span class="board-card" id="bc2" style="color:#FF3B3B;">7&#9830;</span>
        <span class="board-card" id="bc3" style="color:#fff;">2&#9827;</span>
      </div>
      <div id="board-text" style="position:absolute; top:420px; left:0; right:0; text-align:center; opacity:0;">
        <div style="color:#FF3B3B; font-size:52px; font-weight:900; transform:rotate(1deg);">...フルハウスだったわ</div>
      </div>
    </div>

    <!-- REACTION 9.5-11.5s -->
    <div class="clip" id="reaction" data-start="9.5" data-duration="2" data-track-index="0">
      <div style="position:absolute; top:350px; left:0; right:0; text-align:center;">
        <div id="skull-row" style="font-size:120px; opacity:0;">💀💀💀</div>
        <div style="margin-top:30px;">
          <span id="dot1" style="color:#fff; font-size:80px; opacity:0;">。</span>
          <span id="dot2" style="color:#fff; font-size:80px; opacity:0;">。</span>
          <span id="dot3" style="color:#fff; font-size:80px; opacity:0;">。</span>
        </div>
      </div>
    </div>

    <!-- CTA 11.5-15s -->
    <div class="clip" id="cta" data-start="11.5" data-duration="3.5" data-track-index="0">
      <div style="position:absolute; top:300px; left:0; right:0; text-align:center;">
        <div id="cta-logo" style="color:#c9a84c; font-size:80px; font-weight:900; opacity:0;">PokerTALK</div>
        <div id="cta-tagline" style="color:#fff; font-size:32px; margin-top:30px; opacity:0;">テーブルの外でも、ポーカーを語ろう</div>
        <div id="cta-link" style="color:#888; font-size:24px; margin-top:30px; opacity:0;">↓ プロフのリンクから</div>
      </div>
    </div>

  </div>

  <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["v2-reel-06"] = tl;

    // Progress bar
    tl.to("#progress", { width: "100%", duration: 15, ease: "none" }, 0);

    // HOOK
    tl.to("#hook", { opacity: 1, duration: 0.3 }, 0);
    tl.to("#hook-impact", { x: 5, duration: 0.05, yoyo: true, repeat: 5 }, 0.5);
    tl.to("#hook-impact", { x: 0, duration: 0.05 }, 0.8);
    tl.to("#hook", { opacity: 0, duration: 0.3 }, 2.7);

    // HERO HAND
    tl.to("#hero-hand", { opacity: 1, duration: 0.2 }, 3);
    tl.fromTo("#card1", { rotateY: 180 }, { rotateY: 0, duration: 0.5, ease: "power2.out" }, 3.2);
    tl.fromTo("#card2", { rotateY: 180 }, { rotateY: 0, duration: 0.5, ease: "power2.out" }, 3.6);
    tl.fromTo("#fold-stamp", { scale: 2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2)" }, 4.2);
    tl.to("#fold-stamp", { x: 5, duration: 0.04, yoyo: true, repeat: 4 }, 4.3);
    tl.to("#fold-stamp", { x: 0, duration: 0.04 }, 4.5);
    tl.to("#hero-hand", { opacity: 0, duration: 0.3 }, 5.2);

    // BOARD REVEAL
    tl.to("#board", { opacity: 1, duration: 0.3 }, 5.5);
    // Card 1
    tl.to("#bc1", { opacity: 1, duration: 0.2 }, 5.8);
    tl.to("#flash1", { opacity: 0.6, duration: 0.05 }, 5.8);
    tl.to("#flash1", { opacity: 0, duration: 0.15 }, 5.85);
    // Card 2
    tl.to("#bc2", { opacity: 1, duration: 0.2 }, 6.8);
    tl.to("#flash1", { opacity: 0.6, duration: 0.05 }, 6.8);
    tl.to("#flash1", { opacity: 0, duration: 0.15 }, 6.85);
    // Card 3
    tl.to("#bc3", { opacity: 1, duration: 0.2 }, 7.8);
    tl.to("#flash1", { opacity: 0.6, duration: 0.05 }, 7.8);
    tl.to("#flash1", { opacity: 0, duration: 0.15 }, 7.85);
    // Full house text
    tl.to("#board-text", { opacity: 1, duration: 0.5 }, 8.3);
    tl.to("#board", { x: 5, duration: 0.04, yoyo: true, repeat: 5 }, 8.3);
    tl.to("#board", { x: 0, duration: 0.04 }, 8.6);
    tl.to("#board", { opacity: 0, duration: 0.3 }, 9.2);

    // REACTION
    tl.to("#flash1", { opacity: 1, duration: 0.05 }, 9.5);
    tl.to("#flash1", { opacity: 0, duration: 0.15 }, 9.55);
    tl.to("#reaction", { opacity: 1, duration: 0.1 }, 9.5);
    tl.fromTo("#skull-row", { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "elastic.out(1,0.5)" }, 9.6);
    tl.to("#dot1", { opacity: 1, duration: 0.2 }, 10.2);
    tl.to("#dot2", { opacity: 1, duration: 0.2 }, 10.5);
    tl.to("#dot3", { opacity: 1, duration: 0.2 }, 10.8);
    tl.to("#reaction", { opacity: 0, duration: 0.3 }, 11.2);

    // CTA
    tl.to("#cta", { opacity: 1, duration: 0.1 }, 11.5);
    tl.fromTo("#cta-logo", { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "elastic.out(1,0.5)" }, 11.5);
    tl.to("#cta-tagline", { opacity: 1, duration: 0.5 }, 12.0);
    tl.to("#cta-link", { opacity: 1, duration: 0.5 }, 13.0);
  </script>
</div>
</body>
</html>
