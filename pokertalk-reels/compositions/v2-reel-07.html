<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Inter:wght@400;700;900&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0a0d08; font-family: 'Noto Sans JP', sans-serif; }

    .grain { position: absolute; inset: 0; opacity: 0.03; pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .safe { position: absolute; top: 150px; bottom: 250px; left: 60px; right: 60px; }

    .glow-gold { text-shadow: 0 0 20px rgba(201,168,76,0.4), 0 0 40px rgba(201,168,76,0.2); }

    /* LINE chat styles */
    .chat-container { display: flex; flex-direction: column; gap: 20px; width: 100%; }
    .chat-row { display: flex; align-items: flex-end; gap: 12px; }
    .chat-row.right { flex-direction: row-reverse; }
    .chat-avatar { font-size: 40px; flex-shrink: 0; }
    .chat-bubble { max-width: 600px; padding: 20px 28px; border-radius: 20px; font-size: 34px;
      font-weight: 700; line-height: 1.4; }
    .bubble-right { background: rgba(76,175,80,0.15); border: 1px solid rgba(76,175,80,0.3);
      color: #ddd6c8; border-bottom-right-radius: 4px; }
    .bubble-left { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1);
      color: #ddd6c8; border-bottom-left-radius: 4px; }
    .read-text { font-size: 24px; color: #6b7a66; text-align: left; padding-left: 56px; margin-top: -8px; }

    .progress-bar { position: absolute; bottom: 260px; left: 60px; right: 60px; height: 4px;
      background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; }
    .progress-fill { height: 100%; background: #c9a84c; border-radius: 2px; width: 0%; }

    .watermark { position: absolute; bottom: 270px; right: 60px; font-size: 20px;
      font-weight: 700; color: rgba(201,168,76,0.3); font-family: 'Inter', sans-serif;
      letter-spacing: 1px; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="v2-reel-07" data-start="0" data-duration="12" data-width="1080" data-height="1920">

    <!-- BG -->
    <div id="bg" class="clip" data-start="0" data-duration="12" data-track-index="0"
      style="position:absolute;inset:0;">
      <div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%, rgba(201,168,76,0.03) 0%, transparent 50%);"></div>
    </div>

    <!-- Grain -->
    <div id="grain-layer" class="clip" data-start="0" data-duration="12" data-track-index="1"
      style="position:absolute;inset:0;"><div class="grain"></div></div>

    <!-- SCENE 1: HOOK (0-3s) -->
    <div id="scene1" class="clip" data-start="0" data-duration="3" data-track-index="2"
      style="position:absolute;inset:0;">
      <div class="safe" style="display:flex;flex-direction:column;align-items:center;justify-content:center;">
        <div id="s1-title" style="text-align:center;">
          <p style="font-size:64px;font-weight:900;color:#fff;line-height:1.3;">彼女との会話に<br/>ポーカー用語<br/>混ぜてみた</p>
        </div>
        <div id="s1-result" style="margin-top:40px;text-align:center;">
          <p style="font-size:48px;font-weight:700;color:#c0392b;">結果：</p>
        </div>
      </div>
    </div>

    <!-- SCENE 2: LINE chat (3-9s) -->
    <div id="scene2" class="clip" data-start="3" data-duration="6" data-track-index="3"
      style="position:absolute;inset:0;">
      <div class="safe" style="display:flex;flex-direction:column;justify-content:center;">
        <!-- Chat header -->
        <div id="s2-header" style="text-align:center;margin-bottom:32px;padding-bottom:16px;border-bottom:1px solid rgba(255,255,255,0.1);">
          <p style="font-size:28px;color:#6b7a66;">LINE</p>
        </div>
        <div class="chat-container">
          <!-- Message 1: Him -->
          <div id="msg1" class="chat-row right">
            <span class="chat-avatar">👨</span>
            <div class="chat-bubble bubble-right">今日のご飯、EV高いのどこ？</div>
          </div>
          <!-- Message 2: Her -->
          <div id="msg2" class="chat-row">
            <span class="chat-avatar">👩</span>
            <div class="chat-bubble bubble-left">は？</div>
          </div>
          <!-- Message 3: Him -->
          <div id="msg3" class="chat-row right">
            <span class="chat-avatar">👨</span>
            <div class="chat-bubble bubble-right">じゃあ選択肢をレンジで考えよう</div>
          </div>
          <!-- Message 4: Her -->
          <div id="msg4" class="chat-row">
            <span class="chat-avatar">👩</span>
            <div class="chat-bubble bubble-left">日本語で喋って</div>
          </div>
          <!-- Message 5: Him -->
          <div id="msg5" class="chat-row right">
            <span class="chat-avatar">👨</span>
            <div class="chat-bubble bubble-right">これがバランスだよ</div>
          </div>
          <!-- Message 6: Her — "既読" -->
          <div id="msg6" class="read-text">既読</div>
        </div>
      </div>
    </div>

    <!-- SCENE 3: Punchline (9-10.5s) -->
    <div id="scene3" class="clip" data-start="9" data-duration="1.5" data-track-index="4"
      style="position:absolute;inset:0;">
      <div class="safe" style="display:flex;flex-direction:column;align-items:center;justify-content:center;">
        <div id="s3-text" style="text-align:center;">
          <p style="font-size:56px;font-weight:900;color:#ddd6c8;line-height:1.4;">ポーカー語が<br/>通じる場所がある。</p>
        </div>
      </div>
    </div>

    <!-- SCENE 4: CTA (10.5-12s) -->
    <div id="scene4" class="clip" data-start="10.5" data-duration="1.5" data-track-index="5"
      style="position:absolute;inset:0;">
      <div class="safe" style="display:flex;flex-direction:column;align-items:center;justify-content:center;">
        <div id="s4-cta" style="text-align:center;">
          <p style="font-size:80px;font-weight:900;color:#c9a84c;letter-spacing:2px;font-family:'Inter',sans-serif;" class="glow-gold">PokerTALK</p>
          <p style="font-size:28px;color:#6b7a66;margin-top:16px;">↓ プロフのリンクから</p>
        </div>
      </div>
    </div>

    <!-- Progress bar -->
    <div id="progress" class="clip" data-start="0" data-duration="12" data-track-index="6"
      style="position:absolute;inset:0;pointer-events:none;">
      <div class="progress-bar"><div class="progress-fill" id="prog-fill"></div></div>
    </div>

    <!-- Watermark -->
    <div id="wm" class="clip" data-start="0" data-duration="12" data-track-index="7"
      style="position:absolute;inset:0;pointer-events:none;">
      <div class="watermark">PokerTALK</div>
    </div>

    <!-- Flash transitions -->
    <div id="flash1" class="clip" data-start="2.8" data-duration="0.4" data-track-index="8"
      style="position:absolute;inset:0;background:#c9a84c;opacity:0;pointer-events:none;"></div>
    <div id="flash2" class="clip" data-start="8.8" data-duration="0.4" data-track-index="9"
      style="position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;"></div>
    <div id="flash3" class="clip" data-start="10.3" data-duration="0.4" data-track-index="10"
      style="position:absolute;inset:0;background:#c9a84c;opacity:0;pointer-events:none;"></div>

  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // SCENE 1: Hook (0-3s)
    tl.from("#s1-title", { opacity: 0, scale: 1.3, duration: 0.5, ease: "power4.out" }, 0.3);
    tl.from("#s1-result", { opacity: 0, y: 20, duration: 0.4, ease: "power3.out" }, 1.2);
    // Pulse "結果："
    tl.to("#s1-result", { scale: 1.1, duration: 0.3, yoyo: true, repeat: 2, ease: "power1.inOut" }, 1.8);

    // Flash 1
    tl.to("#flash1", { opacity: 0.6, duration: 0.1, ease: "power4.in" }, 2.9);
    tl.to("#flash1", { opacity: 0, duration: 0.2, ease: "power2.out" }, 3.0);

    // SCENE 2: Chat messages appear one by one (3-9s)
    tl.from("#s2-header", { opacity: 0, y: -20, duration: 0.3, ease: "power3.out" }, 3.1);

    tl.from("#msg1", { opacity: 0, x: 30, y: 10, duration: 0.4, ease: "back.out(2)" }, 3.4);
    tl.from("#msg2", { opacity: 0, x: -30, y: 10, duration: 0.4, ease: "back.out(2)" }, 4.2);
    tl.from("#msg3", { opacity: 0, x: 30, y: 10, duration: 0.4, ease: "back.out(2)" }, 5.0);
    tl.from("#msg4", { opacity: 0, x: -30, y: 10, duration: 0.4, ease: "back.out(2)" }, 5.8);
    tl.from("#msg5", { opacity: 0, x: 30, y: 10, duration: 0.4, ease: "back.out(2)" }, 6.6);
    tl.from("#msg6", { opacity: 0, duration: 0.5, ease: "power2.out" }, 7.6);

    // Flash 2
    tl.to("#flash2", { opacity: 0.6, duration: 0.1, ease: "power4.in" }, 8.9);
    tl.to("#flash2", { opacity: 0, duration: 0.2, ease: "power2.out" }, 9.0);

    // SCENE 3: Punchline (9-10.5s)
    tl.from("#s3-text", { opacity: 0, y: 30, duration: 0.5, ease: "power4.out" }, 9.1);

    // Flash 3
    tl.to("#flash3", { opacity: 0.5, duration: 0.1, ease: "power4.in" }, 10.4);
    tl.to("#flash3", { opacity: 0, duration: 0.2, ease: "power2.out" }, 10.5);

    // SCENE 4: CTA (10.5-12s)
    tl.from("#s4-cta p:first-child", { opacity: 0, scale: 0.7, duration: 0.5, ease: "elastic.out(1, 0.5)" }, 10.6);
    tl.from("#s4-cta p:last-child", { opacity: 0, duration: 0.3, ease: "power2.out" }, 11.2);

    // Progress bar
    tl.to("#prog-fill", { width: "100%", duration: 12, ease: "none" }, 0);

    window.__timelines["v2-reel-07"] = tl;
  </script>
</body>
</html>
