<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; font-family: 'Noto Sans JP', sans-serif; }

    .bg {
      position: absolute; inset: 0;
      background: #1a1a1a;
    }
    .bg::after {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse at 50% 30%, rgba(30,40,60,0.3) 0%, transparent 60%);
    }

    .grain { position: absolute; inset: 0; opacity: 0.03; pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .safe { position: absolute; top: 150px; bottom: 200px; left: 60px; right: 60px; }
    .clip { position: absolute; opacity: 0; }
    .fukuro { text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000; }

    .progress-bar { position: absolute; bottom: 100px; left: 60px; right: 60px; height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px; }
    .progress-fill { height: 100%; width: 0%; background: #c9a84c; border-radius: 2px; }

    .flash { position: absolute; inset: 0; background: white; opacity: 0; pointer-events: none; z-index: 100; }

    .bubble-right {
      background: #2d5a3d; border-radius: 20px 20px 4px 20px;
      padding: 20px 28px; margin-bottom: 20px; max-width: 600px;
      margin-left: auto; text-align: left;
    }
    .bubble-left {
      background: #333; border-radius: 20px 20px 20px 4px;
      padding: 20px 28px; margin-bottom: 20px; max-width: 600px;
      text-align: left;
    }
  </style>
</head>
<body>
<div id="root" data-composition-id="v2-reel-07" data-start="0" data-duration="20" data-width="1080" data-height="1920">
  <div class="bg"></div>
  <div class="grain"></div>
  <div class="flash" id="flash1"></div>
  <div class="safe">

    <!-- HOOK 0-3.5s -->
    <div class="clip" id="hook" data-start="0" data-duration="3.5" data-track-index="0">
      <div style="position:absolute; top:120px; left:0; right:0; text-align:center;">
        <div style="color:#fff; font-size:48px; font-weight:700;">彼女にポーカー用語</div>
        <div style="color:#fff; font-size:48px; font-weight:700; margin-top:10px;">使ったら</div>
        <div id="hook-impact" style="color:#FF3B3B; font-size:72px; font-weight:900; transform:rotate(-1deg); margin-top:20px;" class="fukuro">ガチギレされた件</div>
      </div>
      <div style="position:absolute; bottom:100px; right:20px; font-size:80px; transform:rotate(-8deg);">😱</div>
    </div>

    <!-- CHAT 3.5-14s -->
    <div class="clip" id="chat" data-start="3.5" data-duration="10.5" data-track-index="0">
      <div style="position:absolute; top:60px; left:0; right:0;">
        <div id="msg1" class="bubble-right" style="opacity:0;">
          <span style="color:#fff; font-size:32px;">今日のご飯、EV高いとこどこ？</span>
        </div>
        <div id="msg2" class="bubble-left" style="opacity:0;">
          <span style="color:#fff; font-size:36px; font-weight:700;">は？？</span>
        </div>
        <div id="msg3" class="bubble-right" style="opacity:0;">
          <span style="color:#fff; font-size:32px;">選択肢をレンジで絞ろう</span>
        </div>
        <div id="msg4" class="bubble-left" style="opacity:0;">
          <span style="color:#fff; font-size:32px;">日本語で喋って 😡</span>
        </div>
        <div id="msg5" class="bubble-right" style="opacity:0;">
          <span style="color:#fff; font-size:32px;">これがバランスだよ</span>
        </div>
        <div id="msg6" style="opacity:0; margin-top:10px;">
          <span style="color:#888; font-size:24px;">既読</span>
        </div>
      </div>
    </div>

    <!-- PUNCHLINE 14-16.5s -->
    <div class="clip" id="punchline" data-start="14" data-duration="2.5" data-track-index="0">
      <div style="position:absolute; top:280px; left:0; right:0; text-align:center;">
        <div style="color:#fff; font-size:48px; font-weight:700;">ポーカー語が</div>
        <div id="punch-glow" style="color:#FFE136; font-size:64px; font-weight:900; margin-top:20px; text-shadow: 0 0 20px rgba(255,225,54,0.5);">通じる場所がある。</div>
        <div style="color:#888; font-size:28px; margin-top:30px;">（彼女には通じない）</div>
      </div>
    </div>

    <!-- CTA 16.5-20s -->
    <div class="clip" id="cta" data-start="16.5" data-duration="3.5" data-track-index="0">
      <div style="position:absolute; top:300px; left:0; right:0; text-align:center;">
        <div id="cta-logo" style="color:#c9a84c; font-size:80px; font-weight:900; opacity:0;">PokerTALK</div>
        <div id="cta-tagline" style="color:#fff; font-size:32px; margin-top:30px; opacity:0;">テーブルの外でも、ポーカーを語ろう</div>
        <div id="cta-link" style="color:#888; font-size:24px; margin-top:30px; opacity:0;">↓ プロフのリンクから</div>
      </div>
    </div>

  </div>

  <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["v2-reel-07"] = tl;

    // Progress bar
    tl.to("#progress", { width: "100%", duration: 20, ease: "none" }, 0);

    // HOOK
    tl.to("#hook", { opacity: 1, duration: 0.3 }, 0);
    tl.to("#hook-impact", { x: 5, duration: 0.05, yoyo: true, repeat: 4 }, 0.8);
    tl.to("#hook-impact", { x: 0, duration: 0.05 }, 1.1);
    tl.to("#hook", { opacity: 0, duration: 0.3 }, 3.2);

    // CHAT
    tl.to("#chat", { opacity: 1, duration: 0.2 }, 3.5);
    tl.to("#msg1", { opacity: 1, duration: 0.3 }, 3.5);
    tl.to("#msg2", { opacity: 1, duration: 0.3 }, 5.5);
    tl.to("#msg3", { opacity: 1, duration: 0.3 }, 7.5);
    tl.to("#msg4", { opacity: 1, duration: 0.3 }, 9.5);
    tl.to("#msg5", { opacity: 1, duration: 0.3 }, 11.5);
    tl.to("#msg6", { opacity: 1, duration: 0.3 }, 13.0);
    tl.to("#chat", { opacity: 0, duration: 0.3 }, 13.7);

    // PUNCHLINE
    tl.to("#flash1", { opacity: 0.8, duration: 0.05 }, 14);
    tl.to("#flash1", { opacity: 0, duration: 0.15 }, 14.05);
    tl.to("#punchline", { opacity: 1, duration: 0.3 }, 14);
    tl.to("#punch-glow", { textShadow: "0 0 40px rgba(255,225,54,0.8)", duration: 1, yoyo: true, repeat: 1 }, 14.5);
    tl.to("#punchline", { opacity: 0, duration: 0.3 }, 16.2);

    // CTA
    tl.to("#cta", { opacity: 1, duration: 0.1 }, 16.5);
    tl.fromTo("#cta-logo", { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "elastic.out(1,0.5)" }, 16.5);
    tl.to("#cta-tagline", { opacity: 1, duration: 0.5 }, 17.0);
    tl.to("#cta-link", { opacity: 1, duration: 0.5 }, 18.0);
  </script>
</div>
</body>
</html>
