<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0d1009; font-family: 'Noto Sans JP', sans-serif; }
    .mini-card { display:inline-flex;align-items:center;justify-content:center;width:80px;height:110px;border-radius:10px;border:2px solid rgba(201,168,76,0.3);background:#131a14;font-size:32px;font-weight:900;margin:0 4px; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="reel-03" data-start="0" data-duration="12" data-width="1080" data-height="1920">

    <div id="bg" class="clip" data-start="0" data-duration="12" data-track-index="0"
      style="position:absolute;inset:0;background:radial-gradient(circle at 50% 50%, rgba(192,57,43,0.06) 0%, transparent 60%);">
    </div>

    <!-- Hook -->
    <div id="hook" class="clip" data-start="0" data-duration="3" data-track-index="1"
      style="position:absolute;top:350px;left:0;right:0;text-align:center;padding:0 60px;">
      <p style="font-size:64px;font-weight:900;color:#ddd6c8;line-height:1.3;">
        人生で一番キツかった<br/><span style="color:#c0392b;">バッドビート</span><br/>教えて
      </p>
    </div>

    <!-- My story -->
    <div id="story" class="clip" data-start="3" data-duration="3.5" data-track-index="2"
      style="position:absolute;top:300px;left:0;right:0;text-align:center;padding:0 60px;">
      <p style="font-size:40px;color:#6b7a66;margin-bottom:30px;">俺のは…</p>
      <div style="display:flex;justify-content:center;gap:16px;margin-bottom:20px;">
        <div style="text-align:center;">
          <p style="font-size:28px;color:#6b7a66;margin-bottom:8px;">Hero</p>
          <div style="display:flex;gap:8px;">
            <span class="mini-card" style="color:#ddd6c8;">A<span style="font-size:24px;">&#9824;</span></span>
            <span class="mini-card" style="color:#c0392b;">A<span style="font-size:24px;">&#9829;</span></span>
          </div>
        </div>
        <p style="font-size:40px;color:#c9a84c;align-self:center;margin:0 16px;">vs</p>
        <div style="text-align:center;">
          <p style="font-size:28px;color:#6b7a66;margin-bottom:8px;">Villain</p>
          <div style="display:flex;gap:8px;">
            <span class="mini-card" style="color:#ddd6c8;">K<span style="font-size:24px;">&#9824;</span></span>
            <span class="mini-card" style="color:#c0392b;">K<span style="font-size:24px;">&#9829;</span></span>
          </div>
        </div>
      </div>
      <p style="font-size:36px;color:#ddd6c8;margin-top:24px;">オールイン</p>
    </div>

    <!-- Board -->
    <div id="board" class="clip" data-start="5" data-duration="2" data-track-index="3"
      style="position:absolute;top:750px;left:0;right:0;text-align:center;">
      <p style="font-size:28px;color:#6b7a66;margin-bottom:16px;">FLOP</p>
      <div style="display:flex;justify-content:center;gap:12px;">
        <span class="mini-card" style="color:#ddd6c8;">K<span style="font-size:24px;">&#9824;</span></span>
        <span class="mini-card" style="color:#c0392b;">K<span style="font-size:24px;">&#9829;</span></span>
        <span class="mini-card" style="color:#c0392b;">7<span style="font-size:24px;">&#9830;</span></span>
      </div>
    </div>

    <!-- Reaction -->
    <div id="reaction" class="clip" data-start="6.5" data-duration="2" data-track-index="4"
      style="position:absolute;top:400px;left:0;right:0;text-align:center;">
      <p style="font-size:80px;font-weight:900;color:#c0392b;">はい。</p>
      <p style="font-size:120px;margin-top:20px;">💀</p>
    </div>

    <!-- Call to action -->
    <div id="ask" class="clip" data-start="8.5" data-duration="1.5" data-track-index="5"
      style="position:absolute;top:450px;left:0;right:0;text-align:center;padding:0 80px;">
      <p style="font-size:48px;font-weight:700;color:#ddd6c8;line-height:1.4;">
        ポーカーやってたら<br/>絶対1回はある。<br/>
        <span style="color:#c9a84c;">コメントで教えて。</span>
      </p>
    </div>

    <!-- CTA -->
    <div id="cta" class="clip" data-start="10" data-duration="2" data-track-index="6"
      style="position:absolute;top:400px;left:0;right:0;text-align:center;padding:0 60px;">
      <p style="font-size:36px;color:#6b7a66;">バッドビートを供養できるSNS</p>
      <p style="font-size:72px;font-weight:900;color:#c9a84c;margin-top:20px;">PokerTALK</p>
      <p style="font-size:32px;color:#ddd6c8;margin-top:16px;">ハンド投稿して仲間と語れる</p>
      <p style="font-size:28px;color:#6b7a66;margin-top:12px;">プロフのリンクから無料登録</p>
    </div>

  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    tl.from("#hook", { opacity: 0, y: 30, duration: 0.5 }, 0);
    tl.to("#hook", { opacity: 0, duration: 0.3 }, 2.7);
    tl.from("#story", { opacity: 0, y: 20, duration: 0.5 }, 3);
    tl.from("#board", { opacity: 0, scale: 0.8, duration: 0.4 }, 5);
    tl.to("#story", { opacity: 0, duration: 0.2 }, 6.2);
    tl.to("#board", { opacity: 0, duration: 0.2 }, 6.2);
    tl.from("#reaction", { opacity: 0, scale: 1.5, duration: 0.3 }, 6.5);
    tl.to("#reaction", { opacity: 0, duration: 0.3 }, 8.2);
    tl.from("#ask", { opacity: 0, y: 20, duration: 0.4 }, 8.5);
    tl.to("#ask", { opacity: 0, duration: 0.3 }, 9.7);
    tl.from("#cta", { opacity: 0, scale: 0.95, duration: 0.5 }, 10);

    window.__timelines["reel-03"] = tl;
  </script>
</body>
</html>
