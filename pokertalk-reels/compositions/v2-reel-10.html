<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; font-family: 'Noto Sans JP', sans-serif; }

    .bg {
      position: absolute; inset: 0;
      background: #0a120a;
    }
    .bg::after {
      content: ''; position: absolute; inset: 0;
      background: repeating-linear-gradient(to bottom, transparent 0px, transparent 58px, rgba(255,255,255,0.015) 58px, rgba(255,255,255,0.015) 60px);
    }
    .bg-noise {
      position: absolute; inset: 0; opacity: 0.05;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .grain { position: absolute; inset: 0; opacity: 0.03; pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .safe { position: absolute; top: 150px; bottom: 200px; left: 60px; right: 60px; }
    .clip { position: absolute; opacity: 0; }
    .fukuro { text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000; }

    .progress-bar { position: absolute; bottom: 100px; left: 60px; right: 60px; height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px; }
    .progress-fill { height: 100%; width: 0%; background: #c9a84c; border-radius: 2px; }

    .flash { position: absolute; inset: 0; background: white; opacity: 0; pointer-events: none; z-index: 100; }

    .q-card {
      border: 3px solid #c9a84c; border-radius: 16px; padding: 40px;
      background: rgba(201,168,76,0.05); position: relative;
    }
    .q-badge {
      display: inline-block; background: #c9a84c; color: #000; font-size: 32px;
      font-weight: 900; padding: 6px 20px; border-radius: 8px; margin-bottom: 20px;
    }
    .checkmark {
      color: #4CAF50; font-size: 44px; font-weight: 900; margin-left: 12px;
    }
  </style>
</head>
<body>
<div id="root" data-composition-id="v2-reel-10" data-start="0" data-duration="20" data-width="1080" data-height="1920">
  <div class="bg"></div>
  <div class="bg-noise"></div>
  <div class="grain"></div>
  <div class="flash" id="flash1"></div>
  <div class="safe">

    <!-- HOOK 0-3.5s -->
    <div class="clip" id="hook" data-start="0" data-duration="3.5" data-track-index="0">
      <div style="position:absolute; top:180px; left:0; right:0; text-align:center;">
        <div style="color:#fff; font-size:48px; font-weight:700;">3問で</div>
        <div id="hook-impact" style="color:#FFE136; font-size:68px; font-weight:900; transform:rotate(-1.5deg); margin-top:20px;" class="fukuro">お前のポーカーレベル暴く</div>
        <div id="hook-sub" style="color:#888; font-size:28px; margin-top:30px; opacity:0;">一時停止して考えろ 👇</div>
      </div>
      <div style="position:absolute; top:60px; right:10px; font-size:80px; transform:rotate(10deg);">🧪</div>
    </div>

    <!-- Q1 3.5-7.5s -->
    <div class="clip" id="q1" data-start="3.5" data-duration="4" data-track-index="0">
      <div style="position:absolute; top:140px; left:0; right:0;">
        <div class="q-card">
          <div class="q-badge">Q1</div>
          <div style="color:#fff; font-size:40px; font-weight:700;">UTGからのオープンレンジ</div>
          <div style="color:#FFE136; font-size:56px; font-weight:900; margin-top:15px;">何%？</div>
          <div id="a1" style="margin-top:30px; opacity:0;">
            <span style="color:#4ECBFF; font-size:48px; font-weight:700;">→ 約15%</span>
            <span class="checkmark">&#10003;</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Q2 7.5-11.5s -->
    <div class="clip" id="q2" data-start="7.5" data-duration="4" data-track-index="0">
      <div style="position:absolute; top:140px; left:0; right:0;">
        <div class="q-card">
          <div class="q-badge">Q2</div>
          <div style="color:#fff; font-size:40px; font-weight:700;">ポットベットの</div>
          <div style="color:#FFE136; font-size:56px; font-weight:900; margin-top:15px;">オッズは？</div>
          <div id="a2" style="margin-top:30px; opacity:0;">
            <span style="color:#4ECBFF; font-size:48px; font-weight:700;">→ 2:1（33%必要）</span>
            <span class="checkmark">&#10003;</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Q3 11.5-15s -->
    <div class="clip" id="q3" data-start="11.5" data-duration="3.5" data-track-index="0">
      <div style="position:absolute; top:140px; left:0; right:0;">
        <div class="q-card">
          <div class="q-badge">Q3</div>
          <div style="margin-top:5px;">
            <span style="color:#FFE136; font-size:56px; font-weight:900;">'SPR'</span>
            <span style="color:#fff; font-size:40px; font-weight:700;"> の意味は？</span>
          </div>
          <div id="a3" style="margin-top:30px; opacity:0;">
            <span style="color:#4ECBFF; font-size:44px; font-weight:700;">→ Stack to Pot Ratio</span>
            <span class="checkmark">&#10003;</span>
          </div>
        </div>
      </div>
    </div>

    <!-- RESULT 15-16.5s -->
    <div class="clip" id="result" data-start="15" data-duration="1.5" data-track-index="0">
      <div style="position:absolute; top:250px; left:0; right:0; text-align:center;">
        <div style="color:#4CAF50; font-size:36px; font-weight:700;">3問正解 → 中級以上。仲間と語ろう。</div>
        <div style="color:#FFE136; font-size:36px; font-weight:700; margin-top:25px;">0-2問 → 伸びしろしかない。</div>
      </div>
    </div>

    <!-- CTA 16.5-20s -->
    <div class="clip" id="cta" data-start="16.5" data-duration="3.5" data-track-index="0">
      <div style="position:absolute; top:300px; left:0; right:0; text-align:center;">
        <div id="cta-logo" style="color:#c9a84c; font-size:80px; font-weight:900; opacity:0;">PokerTALK</div>
        <div id="cta-tagline" style="color:#fff; font-size:32px; margin-top:30px; opacity:0;">テーブルの外でも、ポーカーを語ろう</div>
        <div id="cta-link" style="color:#888; font-size:24px; margin-top:30px; opacity:0;">↓ プロフのリンクから</div>
      </div>
    </div>

  </div>

  <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["v2-reel-10"] = tl;

    // Progress bar
    tl.to("#progress", { width: "100%", duration: 20, ease: "none" }, 0);

    // HOOK
    tl.to("#hook", { opacity: 1, duration: 0.3 }, 0);
    tl.to("#hook-sub", { opacity: 1, duration: 0.4 }, 1.2);
    tl.to("#hook-sub", { opacity: 0.6, duration: 0.5, yoyo: true, repeat: 2 }, 1.6);
    tl.to("#hook", { opacity: 0, duration: 0.3 }, 3.2);

    // Q1
    tl.to("#q1", { opacity: 1, duration: 0.3 }, 3.5);
    tl.fromTo("#a1", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, 6.0);
    tl.to("#q1", { opacity: 0, duration: 0.3 }, 7.2);

    // Q2
    tl.to("#q2", { opacity: 1, duration: 0.3 }, 7.5);
    tl.fromTo("#a2", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, 10.0);
    tl.to("#q2", { opacity: 0, duration: 0.3 }, 11.2);

    // Q3
    tl.to("#q3", { opacity: 1, duration: 0.3 }, 11.5);
    tl.fromTo("#a3", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, 14.0);
    tl.to("#q3", { opacity: 0, duration: 0.3 }, 14.7);

    // RESULT
    tl.to("#result", { opacity: 1, duration: 0.3 }, 15);
    tl.to("#result", { opacity: 0, duration: 0.3 }, 16.2);

    // CTA
    tl.to("#cta", { opacity: 1, duration: 0.1 }, 16.5);
    tl.fromTo("#cta-logo", { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "elastic.out(1,0.5)" }, 16.5);
    tl.to("#cta-tagline", { opacity: 1, duration: 0.5 }, 17.0);
    tl.to("#cta-link", { opacity: 1, duration: 0.5 }, 18.0);
  </script>
</div>
</body>
</html>
