<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Inter:wght@400;700;900&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0a0d08; font-family: 'Noto Sans JP', sans-serif; }

    .grain { position: absolute; inset: 0; opacity: 0.03; pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .safe { position: absolute; top: 150px; bottom: 250px; left: 60px; right: 60px; }
    .glow-gold { text-shadow: 0 0 20px rgba(201,168,76,0.4), 0 0 40px rgba(201,168,76,0.2); }

    .progress-bar { position: absolute; bottom: 260px; left: 60px; right: 60px; height: 4px;
      background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; }
    .progress-fill { height: 100%; background: #c9a84c; border-radius: 2px; width: 0%; }

    .watermark { position: absolute; bottom: 270px; right: 60px; font-size: 20px;
      font-weight: 700; color: rgba(201,168,76,0.3); font-family: 'Inter', sans-serif;
      letter-spacing: 1px; }

    .quiz-card {
      background: linear-gradient(145deg, #1a2318 0%, #0f150e 100%);
      border: 2px solid rgba(201,168,76,0.4);
      border-radius: 20px;
      padding: 48px 50px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 30px rgba(201,168,76,0.1);
      position: relative;
      width: 100%;
    }
    .quiz-badge {
      position: absolute; top: -24px; left: 40px;
      width: 48px; height: 48px; border-radius: 50%;
      background: #c9a84c; color: #0a0d08;
      font-size: 24px; font-weight: 900; font-family: 'Inter', sans-serif;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 12px rgba(201,168,76,0.4);
    }
    .quiz-answer {
      margin-top: 28px; padding-top: 20px;
      border-top: 1px solid rgba(201,168,76,0.2);
    }
    .checkmark {
      color: #4CAF50; font-size: 36px; font-weight: 900; margin-right: 12px;
    }
  </style>
</head>
<body>
  <div id="root" data-composition-id="v2-reel-10" data-start="0" data-duration="12" data-width="1080" data-height="1920">

    <!-- BG -->
    <div id="bg" class="clip" data-start="0" data-duration="12" data-track-index="0"
      style="position:absolute;inset:0;">
      <div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%, rgba(201,168,76,0.04) 0%, transparent 50%);"></div>
    </div>

    <!-- Grain -->
    <div id="grain-layer" class="clip" data-start="0" data-duration="12" data-track-index="1"
      style="position:absolute;inset:0;"><div class="grain"></div></div>

    <!-- SCENE 1: HOOK (0-3s) -->
    <div id="scene1" class="clip" data-start="0" data-duration="3" data-track-index="2"
      style="position:absolute;inset:0;">
      <div class="safe" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;">
        <div id="s1-title" style="text-align:center;">
          <p style="font-size:60px;font-weight:900;color:#ddd6c8;line-height:1.3;">あなたのポーカーレベル</p>
        </div>
        <div id="s1-number" style="text-align:center;">
          <p style="font-size:160px;font-weight:900;color:#c9a84c;line-height:1;font-family:'Inter',sans-serif;" class="glow-gold">3</p>
        </div>
        <div id="s1-sub" style="text-align:center;">
          <p style="font-size:56px;font-weight:900;color:#ddd6c8;line-height:1.3;">問で分かる。</p>
        </div>
        <div id="s1-small" style="text-align:center;margin-top:20px;">
          <p style="font-size:32px;font-weight:700;color:#9a8e7a;line-height:1.4;">一時停止して考えて &#x1F447;</p>
        </div>
      </div>
    </div>

    <!-- SCENE 2: Q1 (3-5.5s) -->
    <div id="scene2" class="clip" data-start="3" data-duration="2.5" data-track-index="3"
      style="position:absolute;inset:0;">
      <div class="safe" style="display:flex;flex-direction:column;align-items:center;justify-content:center;">
        <div id="s2-card" class="quiz-card">
          <div class="quiz-badge">1</div>
          <p style="font-size:42px;font-weight:900;color:#ddd6c8;line-height:1.4;">UTGからのオープンレンジ、<br/>何%？</p>
          <div id="s2-answer" class="quiz-answer">
            <p style="font-size:48px;font-weight:900;color:#4CAF50;line-height:1.3;"><span class="checkmark">&#10003;</span>約15%</p>
          </div>
        </div>
      </div>
    </div>

    <!-- SCENE 3: Q2 (5.5-8s) -->
    <div id="scene3" class="clip" data-start="5.5" data-duration="2.5" data-track-index="4"
      style="position:absolute;inset:0;">
      <div class="safe" style="display:flex;flex-direction:column;align-items:center;justify-content:center;">
        <div id="s3-card" class="quiz-card">
          <div class="quiz-badge">2</div>
          <p style="font-size:42px;font-weight:900;color:#ddd6c8;line-height:1.4;">ポットベットの<br/>オッズは？</p>
          <div id="s3-answer" class="quiz-answer">
            <p style="font-size:48px;font-weight:900;color:#4CAF50;line-height:1.3;"><span class="checkmark">&#10003;</span>2:1（33%必要）</p>
          </div>
        </div>
      </div>
    </div>

    <!-- SCENE 4: Q3 (8-10s) -->
    <div id="scene4" class="clip" data-start="8" data-duration="2" data-track-index="5"
      style="position:absolute;inset:0;">
      <div class="safe" style="display:flex;flex-direction:column;align-items:center;justify-content:center;">
        <div id="s4-card" class="quiz-card">
          <div class="quiz-badge">3</div>
          <p style="font-size:42px;font-weight:900;color:#ddd6c8;line-height:1.4;">'SPR' の意味は？</p>
          <div id="s4-answer" class="quiz-answer">
            <p style="font-size:44px;font-weight:900;color:#4CAF50;line-height:1.3;"><span class="checkmark">&#10003;</span>Stack to Pot Ratio</p>
          </div>
        </div>
      </div>
    </div>

    <!-- SCENE 5: Result + CTA (10-12s) -->
    <div id="scene5" class="clip" data-start="10" data-duration="2" data-track-index="6"
      style="position:absolute;inset:0;">
      <div class="safe" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px;">
        <div id="s5-result1" style="text-align:center;">
          <p style="font-size:38px;font-weight:700;color:#4CAF50;line-height:1.4;">3問正解 → 中級以上。仲間と語ろう。</p>
        </div>
        <div id="s5-result2" style="text-align:center;">
          <p style="font-size:38px;font-weight:700;color:#c9a84c;line-height:1.4;">0-2問 → 成長中。一緒に学ぼう。</p>
        </div>
        <div id="s5-cta" style="text-align:center;margin-top:30px;">
          <p style="font-size:72px;font-weight:900;color:#c9a84c;letter-spacing:2px;font-family:'Inter',sans-serif;" class="glow-gold">PokerTALK</p>
          <p style="font-size:28px;color:#6b7a66;margin-top:16px;">↓ プロフのリンクから</p>
        </div>
      </div>
    </div>

    <!-- Progress bar -->
    <div id="progress" class="clip" data-start="0" data-duration="12" data-track-index="7"
      style="position:absolute;inset:0;pointer-events:none;">
      <div class="progress-bar"><div class="progress-fill" id="prog-fill"></div></div>
    </div>

    <!-- Watermark -->
    <div id="wm" class="clip" data-start="0" data-duration="12" data-track-index="8"
      style="position:absolute;inset:0;pointer-events:none;">
      <div class="watermark">PokerTALK</div>
    </div>

    <!-- Flash transitions -->
    <div id="flash1" class="clip" data-start="2.8" data-duration="0.4" data-track-index="9"
      style="position:absolute;inset:0;background:#c9a84c;opacity:0;pointer-events:none;"></div>
    <div id="flash2" class="clip" data-start="5.3" data-duration="0.4" data-track-index="10"
      style="position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;"></div>
    <div id="flash3" class="clip" data-start="7.8" data-duration="0.4" data-track-index="11"
      style="position:absolute;inset:0;background:#c9a84c;opacity:0;pointer-events:none;"></div>
    <div id="flash4" class="clip" data-start="9.8" data-duration="0.4" data-track-index="12"
      style="position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;"></div>

  </div>

  <script>
    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    /* --- SCENE 1: HOOK (0-3s) --- */
    tl.from("#s1-title", { opacity: 0, y: 40, duration: 0.5, ease: "power4.out" }, 0.2);
    tl.from("#s1-number", { opacity: 0, scale: 0.3, duration: 0.6, ease: "elastic.out(1, 0.5)" }, 0.6);
    tl.from("#s1-sub", { opacity: 0, y: 30, duration: 0.4, ease: "power4.out" }, 1.2);
    tl.from("#s1-small", { opacity: 0, duration: 0.4, ease: "power4.out" }, 1.8);
    // Pulse the pointing emoji text
    tl.to("#s1-small p", { scale: 1.05, duration: 0.3, yoyo: true, repeat: 1, ease: "power1.inOut" }, 2.2);

    // Flash 1
    tl.to("#flash1", { opacity: 0.6, duration: 0.1, ease: "power4.in" }, 2.9);
    tl.to("#flash1", { opacity: 0, duration: 0.2, ease: "power2.out" }, 3.0);

    /* --- SCENE 2: Q1 (3-5.5s) --- */
    gsap.set("#s2-answer", { opacity: 0, y: 20 });
    tl.from("#s2-card", { opacity: 0, scale: 0.7, rotateX: 30, duration: 0.5, ease: "back.out(2)" }, 3.1);
    // Answer appears after pause
    tl.to("#s2-answer", { opacity: 1, y: 0, duration: 0.4, ease: "power4.out" }, 4.3);

    // Flash 2
    tl.to("#flash2", { opacity: 0.5, duration: 0.1, ease: "power4.in" }, 5.4);
    tl.to("#flash2", { opacity: 0, duration: 0.2, ease: "power2.out" }, 5.5);

    /* --- SCENE 3: Q2 (5.5-8s) --- */
    gsap.set("#s3-answer", { opacity: 0, y: 20 });
    tl.from("#s3-card", { opacity: 0, scale: 0.7, rotateX: 30, duration: 0.5, ease: "back.out(2)" }, 5.6);
    tl.to("#s3-answer", { opacity: 1, y: 0, duration: 0.4, ease: "power4.out" }, 6.8);

    // Flash 3
    tl.to("#flash3", { opacity: 0.5, duration: 0.1, ease: "power4.in" }, 7.9);
    tl.to("#flash3", { opacity: 0, duration: 0.2, ease: "power2.out" }, 8.0);

    /* --- SCENE 4: Q3 (8-10s) --- */
    gsap.set("#s4-answer", { opacity: 0, y: 20 });
    tl.from("#s4-card", { opacity: 0, scale: 0.7, rotateX: 30, duration: 0.5, ease: "back.out(2)" }, 8.1);
    tl.to("#s4-answer", { opacity: 1, y: 0, duration: 0.4, ease: "power4.out" }, 9.1);

    // Flash 4
    tl.to("#flash4", { opacity: 0.5, duration: 0.1, ease: "power4.in" }, 9.9);
    tl.to("#flash4", { opacity: 0, duration: 0.2, ease: "power2.out" }, 10.0);

    /* --- SCENE 5: Result + CTA (10-12s) --- */
    tl.from("#s5-result1", { opacity: 0, x: -100, duration: 0.4, ease: "power4.out" }, 10.1);
    tl.from("#s5-result2", { opacity: 0, x: 100, duration: 0.4, ease: "power4.out" }, 10.4);
    tl.from("#s5-cta p:first-child", { opacity: 0, scale: 0.7, duration: 0.5, ease: "elastic.out(1, 0.5)" }, 10.8);
    tl.from("#s5-cta p:last-child", { opacity: 0, duration: 0.3 }, 11.3);

    // Progress bar
    tl.to("#prog-fill", { width: "100%", duration: 12, ease: "none" }, 0);

    window.__timelines["v2-reel-10"] = tl;
  </script>
</body>
</html>
