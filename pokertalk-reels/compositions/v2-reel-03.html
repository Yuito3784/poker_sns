<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; font-family: 'Noto Sans JP', sans-serif; }

    .bg {
      position: absolute; inset: 0;
      background: #0a0f1a;
    }

    .grain { position: absolute; inset: 0; opacity: 0.03; pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .safe { position: absolute; top: 150px; bottom: 200px; left: 60px; right: 60px; }
    .clip { position: absolute; opacity: 0; }
    .fukuro { text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000; }

    .progress-bar { position: absolute; bottom: 100px; left: 60px; right: 60px; height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px; }
    .progress-fill { height: 100%; width: 0%; background: #c9a84c; border-radius: 2px; }

    .gold-badge { display: inline-block; background: linear-gradient(135deg, #c9a84c, #a08030); color: #fff; font-size: 28px; font-weight: 900; padding: 8px 20px; border-radius: 10px; margin-bottom: 12px; }
    .timeline-line { position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: linear-gradient(to bottom, #c9a84c, rgba(201,168,76,0.2)); border-radius: 2px; }

    .circle-highlight { display: inline-block; border: 3px solid #FF3B3B; border-radius: 50%; padding: 4px 12px; }
  </style>
</head>
<body>
<div id="root" data-composition-id="v2-reel-03" data-start="0" data-duration="20" data-width="1080" data-height="1920">
  <div class="bg" id="bg-color"></div>
  <div class="grain"></div>
  <div class="safe">

    <!-- HOOK 0-3.5s -->
    <div class="clip" id="hook" data-start="0" data-duration="3.5" data-track-index="0">
      <div style="position:absolute; top:100px; left:0;">
        <div style="color:#fff; font-size:48px; font-weight:700;">ポーカー民の1日が</div>
        <div style="color:#FFE136; font-size:80px; font-weight:900; transform:rotate(-2deg); margin-top:20px;" class="fukuro">やばすぎるｗｗｗ</div>
      </div>
      <div style="position:absolute; bottom:100px; right:20px; font-size:90px;">🃏</div>
      <div id="clock-emoji" style="position:absolute; top:80px; right:60px; font-size:70px;">⏰</div>
    </div>

    <!-- 14:00 & 16:00 (3.5-7s) -->
    <div class="clip" id="schedule1" data-start="3.5" data-duration="3.5" data-track-index="0">
      <div style="position:absolute; top:150px; left:40px;">
        <div class="timeline-line"></div>
        <div style="padding-left:30px;">
          <div class="gold-badge">14:00</div>
          <div style="color:#fff; font-size:40px; font-weight:400;">起床。ポーカーの夢見てたｗ</div>
          <div id="sched1-b" style="margin-top:40px; opacity:0;">
            <div class="gold-badge">16:00</div>
            <div style="color:#fff; font-size:40px; font-weight:400;">レンジ表眺めながらコーヒー☕</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 19:00 (7-10.5s) -->
    <div class="clip" id="schedule2" data-start="7" data-duration="3.5" data-track-index="0">
      <div style="position:absolute; top:200px; left:40px;">
        <div class="timeline-line"></div>
        <div style="padding-left:30px;">
          <div class="gold-badge" style="font-size:32px; padding:10px 24px;">19:00</div>
          <div style="color:#fff; font-size:44px; font-weight:700; margin-top:10px;">アミューズメント到着。</div>
          <div style="color:#FFE136; font-size:44px; font-weight:700; margin-top:16px;">今日こそプラスで終わる💪</div>
        </div>
      </div>
    </div>

    <!-- 23:00 & 01:00 (10.5-14s) -->
    <div class="clip" id="schedule3" data-start="10.5" data-duration="3.5" data-track-index="0">
      <div style="position:absolute; top:150px; left:40px;">
        <div class="timeline-line"></div>
        <div style="padding-left:30px;">
          <div class="gold-badge">23:00</div>
          <div id="dobon" style="color:#FF3B3B; font-size:56px; font-weight:900;">...ドボン。</div>
          <div style="color:#888; font-size:32px; margin-top:8px;">でも学びはあった（震え声）</div>
          <div id="sched3-b" style="margin-top:40px; opacity:0;">
            <div class="gold-badge">01:00</div>
            <div style="color:#fff; font-size:40px;">帰り道にハンド振り返り</div>
            <div style="margin-top:12px;">
              <span class="circle-highlight" id="kore-text" style="color:#FF3B3B; font-size:48px; font-weight:900;">←これ</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- POINT 14-16.5s -->
    <div class="clip" id="point" data-start="14" data-duration="2.5" data-track-index="0">
      <div style="position:absolute; top:350px; left:0; right:0; text-align:center;">
        <span style="color:#fff; font-size:44px; font-weight:700;">この</span>
        <span style="color:#FFE136; font-size:72px; font-weight:900; text-decoration:underline; text-underline-offset:10px;">振り返り</span>
        <span style="color:#fff; font-size:44px; font-weight:700;">をどこでやる？</span>
      </div>
    </div>

    <!-- CTA 16.5-20s -->
    <div class="clip" id="cta" data-start="16.5" data-duration="3.5" data-track-index="0">
      <div style="position:absolute; top:300px; left:0; right:0; text-align:center;">
        <div id="cta-logo" style="color:#c9a84c; font-size:80px; font-weight:900; opacity:0;">PokerTALK</div>
        <div id="cta-tagline" style="color:#fff; font-size:32px; margin-top:30px; opacity:0;">テーブルの外でも、ポーカーを語ろう</div>
        <div id="cta-link" style="color:#888; font-size:24px; margin-top:30px; opacity:0;">↓ プロフのリンクから</div>
      </div>
    </div>

  </div>

  <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["v2-reel-03"] = tl;

    tl.to("#progress", { width: "100%", duration: 20, ease: "none" }, 0);

    // Background color shift
    tl.to("#bg-color", { backgroundColor: "#1a140a", duration: 7, ease: "none" }, 5);
    tl.to("#bg-color", { backgroundColor: "#0a0d08", duration: 5, ease: "none" }, 12);

    // HOOK
    tl.to("#hook", { opacity: 1, duration: 0.3 }, 0);
    tl.to("#clock-emoji", { rotation: 360, duration: 3, ease: "none" }, 0);
    tl.to("#hook", { opacity: 0, duration: 0.3 }, 3.2);

    // Schedule 1
    tl.to("#schedule1", { opacity: 1, duration: 0.3 }, 3.5);
    tl.to("#sched1-b", { opacity: 1, duration: 0.4 }, 5.2);
    tl.to("#schedule1", { opacity: 0, duration: 0.3 }, 6.7);

    // Schedule 2
    tl.to("#schedule2", { opacity: 1, duration: 0.3 }, 7);
    tl.to("#schedule2", { opacity: 0, duration: 0.3 }, 10.2);

    // Schedule 3
    tl.to("#schedule3", { opacity: 1, duration: 0.3 }, 10.5);
    // screen shake on dobon
    tl.to("#dobon", { x: 5, duration: 0.05, yoyo: true, repeat: 5 }, 10.8);
    tl.to("#dobon", { x: 0, duration: 0.05 }, 11.1);
    tl.to("#sched3-b", { opacity: 1, duration: 0.4 }, 12.2);
    // pulse kore
    tl.to("#kore-text", { scale: 1.1, duration: 0.4, yoyo: true, repeat: 2, ease: "sine.inOut" }, 12.5);
    tl.to("#schedule3", { opacity: 0, duration: 0.3 }, 13.7);

    // POINT
    tl.to("#point", { opacity: 1, duration: 0.3 }, 14);
    tl.to("#point", { opacity: 0, duration: 0.3 }, 16.2);

    // CTA
    tl.to("#cta", { opacity: 1, duration: 0.1 }, 16.5);
    tl.fromTo("#cta-logo", { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "elastic.out(1,0.5)" }, 16.5);
    tl.to("#cta-tagline", { opacity: 1, duration: 0.5 }, 17.0);
    tl.to("#cta-link", { opacity: 1, duration: 0.5 }, 18.0);
  </script>
</div>
</body>
</html>
