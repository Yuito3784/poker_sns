<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0d1009; font-family: 'Noto Sans JP', sans-serif; }
    .bubble { background: #131a14; border: 1px solid #2a3828; border-radius: 20px; padding: 32px 40px; margin: 0 60px; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="reel-04" data-start="0" data-duration="12" data-width="1080" data-height="1920">

    <div id="bg" class="clip" data-start="0" data-duration="12" data-track-index="0"
      style="position:absolute;inset:0;background:radial-gradient(circle at 50% 35%, rgba(201,168,76,0.05) 0%, transparent 60%);">
    </div>

    <!-- Hook -->
    <div id="hook" class="clip" data-start="0" data-duration="3" data-track-index="1"
      style="position:absolute;top:350px;left:0;right:0;text-align:center;padding:0 60px;">
      <p style="font-size:56px;font-weight:900;color:#ddd6c8;line-height:1.3;">
        ポーカー用語を<br/><span style="color:#c9a84c;">彼女に説明</span><br/>しようとした結果
      </p>
    </div>

    <!-- My explanation -->
    <div id="explain" class="clip" data-start="3" data-duration="3" data-track-index="2"
      style="position:absolute;top:300px;left:0;right:0;">
      <div class="bubble">
        <p style="font-size:28px;color:#6b7a66;margin-bottom:12px;">👨 俺：</p>
        <p style="font-size:36px;color:#ddd6c8;line-height:1.5;">
          「ドンクベットされて<br/>フロートしたら<br/>ターンで<br/>チェックレイズされた」
        </p>
      </div>
    </div>

    <!-- Her response -->
    <div id="response" class="clip" data-start="5" data-duration="2.5" data-track-index="3"
      style="position:absolute;top:750px;left:0;right:0;">
      <div class="bubble" style="background:rgba(201,168,76,0.05);border-color:rgba(201,168,76,0.2);">
        <p style="font-size:28px;color:#6b7a66;margin-bottom:12px;">👩 彼女：</p>
        <p style="font-size:64px;font-weight:900;color:#c9a84c;text-align:center;">
          「何語？」
        </p>
      </div>
    </div>

    <!-- Need -->
    <div id="need" class="clip" data-start="7.5" data-duration="2.5" data-track-index="4"
      style="position:absolute;top:450px;left:0;right:0;text-align:center;padding:0 80px;">
      <p style="font-size:48px;font-weight:700;color:#ddd6c8;line-height:1.5;">
        この会話が<br/><span style="color:#c9a84c;">成立する場所</span>が<br/>ほしかった。
      </p>
    </div>

    <!-- CTA -->
    <div id="cta" class="clip" data-start="10" data-duration="2" data-track-index="5"
      style="position:absolute;top:420px;left:0;right:0;text-align:center;padding:0 60px;">
      <p style="font-size:72px;font-weight:900;color:#c9a84c;">PokerTALK</p>
      <p style="font-size:40px;color:#ddd6c8;margin-top:20px;">ポーカーの話が通じるSNS</p>
      <p style="font-size:28px;color:#6b7a66;margin-top:16px;">プロフのリンクから</p>
    </div>

  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    tl.from("#hook", { opacity: 0, y: 30, duration: 0.5 }, 0);
    tl.to("#hook", { opacity: 0, duration: 0.3 }, 2.7);
    tl.from("#explain", { opacity: 0, x: -30, duration: 0.5 }, 3);
    tl.from("#response", { opacity: 0, x: 30, duration: 0.5 }, 5);
    tl.to("#explain", { opacity: 0, duration: 0.3 }, 7);
    tl.to("#response", { opacity: 0, duration: 0.3 }, 7);
    tl.from("#need", { opacity: 0, y: 20, duration: 0.5 }, 7.5);
    tl.to("#need", { opacity: 0, duration: 0.3 }, 9.7);
    tl.from("#cta", { opacity: 0, scale: 0.9, duration: 0.5 }, 10);

    window.__timelines["reel-04"] = tl;
  </script>
</body>
</html>
