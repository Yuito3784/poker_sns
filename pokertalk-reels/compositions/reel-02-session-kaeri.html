<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0d1009; font-family: 'Noto Sans JP', sans-serif; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="reel-02" data-start="0" data-duration="13" data-width="1080" data-height="1920">

    <div id="bg" class="clip" data-start="0" data-duration="13" data-track-index="0"
      style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%, rgba(201,168,76,0.06) 0%, transparent 70%);">
    </div>

    <!-- Scene 1: Hook -->
    <div id="s1" class="clip" data-start="0" data-duration="3" data-track-index="1"
      style="position:absolute;top:400px;left:0;right:0;text-align:center;padding:0 80px;">
      <p style="font-size:64px;font-weight:900;color:#ddd6c8;line-height:1.3;">
        ポーカー打った帰り道<br/><span style="color:#c9a84c;">全員これやってる</span>
      </p>
    </div>

    <!-- Scene 2: Thinking -->
    <div id="s2" class="clip" data-start="3" data-duration="2.5" data-track-index="2"
      style="position:absolute;top:350px;left:0;right:0;text-align:center;padding:0 80px;">
      <p style="font-size:52px;font-weight:700;color:#ddd6c8;line-height:1.5;">
        電車でスマホ開いて<br/>今日のハンド<br/>思い出してる
      </p>
      <p style="font-size:120px;margin-top:40px;">🚃</p>
    </div>

    <!-- Scene 3: Regret -->
    <div id="s3" class="clip" data-start="5.5" data-duration="2.5" data-track-index="3"
      style="position:absolute;top:350px;left:0;right:0;text-align:center;padding:0 60px;">
      <p style="font-size:44px;color:#9a8e7a;line-height:1.6;font-style:italic;">
        "あそこでベットしてれば…"<br/><br/>
        "あのコールは正しかった…"
      </p>
    </div>

    <!-- Scene 4: Problem -->
    <div id="s4" class="clip" data-start="8" data-duration="2.5" data-track-index="4"
      style="position:absolute;top:400px;left:0;right:0;text-align:center;padding:0 80px;">
      <p style="font-size:48px;font-weight:700;color:#ddd6c8;line-height:1.5;">
        でも<span style="color:#c9a84c;">語る相手</span>がいない。<br/>
        <span style="font-size:36px;color:#6b7a66;">Twitterに書くのも違う。</span>
      </p>
    </div>

    <!-- Scene 5: Solution + CTA -->
    <div id="s5" class="clip" data-start="10.5" data-duration="2.5" data-track-index="5"
      style="position:absolute;top:350px;left:0;right:0;text-align:center;padding:0 60px;">
      <p style="font-size:44px;color:#9a8e7a;">だから作った。</p>
      <p style="font-size:40px;color:#ddd6c8;margin-top:24px;">セッション帰りに<br/>ハンドを投稿できるSNS。</p>
      <p style="font-size:72px;font-weight:900;color:#c9a84c;margin-top:40px;">PokerTALK</p>
      <p style="font-size:28px;color:#6b7a66;margin-top:16px;">リンクはプロフから</p>
    </div>

    <!-- Suit decorations -->
    <div id="suits" class="clip" data-start="0" data-duration="13" data-track-index="6"
      style="position:absolute;inset:0;pointer-events:none;">
      <span style="position:absolute;top:120px;left:80px;font-size:80px;color:rgba(201,168,76,0.06);font-weight:bold;">&#9824;</span>
      <span style="position:absolute;top:180px;right:100px;font-size:100px;color:rgba(192,57,43,0.06);font-weight:bold;">&#9829;</span>
      <span style="position:absolute;bottom:300px;left:60px;font-size:90px;color:rgba(192,57,43,0.06);font-weight:bold;">&#9830;</span>
      <span style="position:absolute;bottom:240px;right:80px;font-size:80px;color:rgba(201,168,76,0.06);font-weight:bold;">&#9827;</span>
    </div>

  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    tl.from("#s1", { opacity: 0, y: 30, duration: 0.5 }, 0);
    tl.to("#s1", { opacity: 0, duration: 0.3 }, 2.5);
    tl.from("#s2", { opacity: 0, y: 20, duration: 0.5 }, 3);
    tl.to("#s2", { opacity: 0, duration: 0.3 }, 5);
    tl.from("#s3", { opacity: 0, duration: 0.5 }, 5.5);
    tl.to("#s3", { opacity: 0, duration: 0.3 }, 7.5);
    tl.from("#s4", { opacity: 0, y: 20, duration: 0.5 }, 8);
    tl.to("#s4", { opacity: 0, duration: 0.3 }, 10);
    tl.from("#s5", { opacity: 0, scale: 0.95, duration: 0.6 }, 10.5);

    window.__timelines["reel-02"] = tl;
  </script>
</body>
</html>
