<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; font-family: 'Noto Sans JP', sans-serif; }

    .bg {
      position: absolute; inset: 0;
      background: #080a14;
    }
    .bg::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse at 20% 15%, rgba(100,140,255,0.03) 0%, transparent 50%);
    }

    .grain { position: absolute; inset: 0; opacity: 0.03; pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .safe { position: absolute; top: 150px; bottom: 200px; left: 60px; right: 60px; }
    .clip { position: absolute; opacity: 0; }
    .fukuro { text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000; }

    .progress-bar { position: absolute; bottom: 100px; left: 60px; right: 60px; height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px; }
    .progress-fill { height: 100%; width: 0%; background: #c9a84c; border-radius: 2px; }

    .flash { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 100; }

    .glow-yellow { text-shadow: 0 0 20px rgba(255,225,54,0.4), 0 0 40px rgba(255,225,54,0.2), -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000; }
  </style>
</head>
<body>
<div id="root" data-composition-id="v2-reel-05" data-start="0" data-duration="20" data-width="1080" data-height="1920">
  <div class="bg"></div>
  <div class="grain"></div>
  <div class="flash" id="flash1"></div>
  <div class="safe">

    <!-- HOOK 0-3.5s -->
    <div class="clip" id="hook" data-start="0" data-duration="3.5" data-track-index="0">
      <div style="position:absolute; top:200px; left:0;">
        <div id="hook-small" style="color:#888; font-size:36px; opacity:0;">え、</div>
        <div id="hook-mid" style="color:#fff; font-size:56px; font-weight:700; margin-top:16px; opacity:0;">3日前のハンド</div>
        <div id="hook-mid2" style="color:#fff; font-size:48px; font-weight:700; margin-top:8px; opacity:0;">まだ脳内再生してるの</div>
        <div id="hook-big" style="color:#FFE136; font-size:72px; font-weight:900; transform:rotate(-2deg); margin-top:20px; opacity:0;" class="fukuro">俺だけ？？</div>
      </div>
      <div id="brain-emoji" style="position:absolute; top:180px; right:30px; font-size:80px; opacity:0;">🧠</div>
    </div>

    <!-- SYMPTOMS 3.5-7.5s -->
    <div class="clip" id="symptoms1" data-start="3.5" data-duration="4" data-track-index="0">
      <div style="position:absolute; top:180px; left:0;">
        <div style="color:#fff; font-size:36px;">✓ 布団の中で</div>
        <div style="color:#4ECBFF; font-size:44px; font-style:italic; margin-top:12px; padding-left:30px;">'チェックレイズしてれば...'</div>
        <div id="symp1-b" style="margin-top:50px; opacity:0;">
          <div style="color:#fff; font-size:36px;">✓ シャワー中に</div>
          <div style="color:#4ECBFF; font-size:44px; font-style:italic; margin-top:12px; padding-left:30px;">'あのベットサイズ...'</div>
        </div>
      </div>
    </div>

    <!-- MORE SYMPTOMS 7.5-11s -->
    <div class="clip" id="symptoms2" data-start="7.5" data-duration="3.5" data-track-index="0">
      <div style="position:absolute; top:200px; left:0;">
        <div style="color:#fff; font-size:36px;">✓ 仕事中に</div>
        <div style="color:#4ECBFF; font-size:44px; font-style:italic; margin-top:12px; padding-left:30px;">'ポットオッズが...'</div>
        <div id="symp2-punchline" style="color:#888; font-size:40px; margin-top:50px; opacity:0;">...完全に病気ｗｗｗ</div>
      </div>
      <div id="laugh-emoji" style="position:absolute; top:450px; right:30px; font-size:90px; opacity:0;">😂</div>
    </div>

    <!-- SOLUTION 11-14.5s -->
    <div class="clip" id="solution" data-start="11" data-duration="3.5" data-track-index="0">
      <div style="position:absolute; top:250px; left:0; right:0; text-align:center;">
        <div style="color:#fff; font-size:48px; font-weight:700;">一人で考えても</div>
        <div style="color:#fff; font-size:48px; font-weight:700; margin-top:12px;">答え出ないんよ。</div>
        <div id="solution-big" style="margin-top:50px; opacity:0;">
          <div style="color:#FFE136; font-size:80px; font-weight:900;" class="glow-yellow">語ればいい。</div>
        </div>
      </div>
    </div>

    <!-- BRIDGE 14.5-16.5s -->
    <div class="clip" id="bridge" data-start="14.5" data-duration="2" data-track-index="0">
      <div style="position:absolute; top:300px; left:0; right:0; text-align:center;">
        <div style="color:#fff; font-size:44px; font-weight:700;">ハンド投稿したら</div>
        <div style="color:#4ECBFF; font-size:44px; font-weight:700; margin-top:16px;">仲間がレビューしてくれる。</div>
      </div>
    </div>

    <!-- CTA 16.5-20s -->
    <div class="clip" id="cta" data-start="16.5" data-duration="3.5" data-track-index="0">
      <div style="position:absolute; top:300px; left:0; right:0; text-align:center;">
        <div id="cta-logo" style="color:#c9a84c; font-size:80px; font-weight:900; opacity:0;">PokerTALK</div>
        <div id="cta-tagline" style="color:#fff; font-size:32px; margin-top:30px; opacity:0;">テーブルの外でも、ポーカーを語ろう</div>
        <div id="cta-link" style="color:#888; font-size:24px; margin-top:30px; opacity:0;">↓ プロフのリンクから</div>
      </div>
    </div>

  </div>

  <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["v2-reel-05"] = tl;

    tl.to("#progress", { width: "100%", duration: 20, ease: "none" }, 0);

    // HOOK
    tl.to("#hook", { opacity: 1, duration: 0.1 }, 0);
    tl.to("#hook-small", { opacity: 1, duration: 0.3 }, 0);
    tl.to("#hook-mid", { opacity: 1, duration: 0.3 }, 0.5);
    tl.to("#hook-mid2", { opacity: 1, duration: 0.3 }, 1.0);
    tl.to("#hook-big", { opacity: 1, duration: 0.3 }, 1.5);
    tl.to("#brain-emoji", { opacity: 1, duration: 0.3 }, 1.5);
    tl.to("#brain-emoji", { rotation: 360, duration: 3, ease: "none", repeat: 15 }, 1.5);
    tl.to("#hook", { opacity: 0, duration: 0.3 }, 3.2);

    // SYMPTOMS 1
    tl.to("#symptoms1", { opacity: 1, duration: 0.3 }, 3.5);
    tl.to("#symp1-b", { opacity: 1, duration: 0.4 }, 5.5);
    tl.to("#symptoms1", { opacity: 0, duration: 0.3 }, 7.2);

    // SYMPTOMS 2
    tl.to("#symptoms2", { opacity: 1, duration: 0.3 }, 7.5);
    tl.to("#symp2-punchline", { opacity: 1, duration: 0.4 }, 9.0);
    tl.to("#laugh-emoji", { opacity: 1, duration: 0.3 }, 9.2);
    tl.to("#laugh-emoji", { y: -15, duration: 0.3, yoyo: true, repeat: 3, ease: "sine.inOut" }, 9.3);
    tl.to("#symptoms2", { opacity: 0, duration: 0.3 }, 10.7);

    // SOLUTION
    tl.to("#flash1", { opacity: 1, duration: 0.1 }, 11);
    tl.to("#flash1", { opacity: 0, duration: 0.2 }, 11.1);
    tl.to("#solution", { opacity: 1, duration: 0.3 }, 11.2);
    tl.to("#solution-big", { opacity: 1, duration: 0.4 }, 13.0);
    tl.fromTo("#solution-big", { scale: 0.8 }, { scale: 1, duration: 0.5, ease: "back.out(1.5)" }, 13.0);
    tl.to("#solution", { opacity: 0, duration: 0.3 }, 14.2);

    // BRIDGE
    tl.to("#bridge", { opacity: 1, duration: 0.3 }, 14.5);
    tl.to("#bridge", { opacity: 0, duration: 0.3 }, 16.2);

    // CTA
    tl.to("#cta", { opacity: 1, duration: 0.1 }, 16.5);
    tl.fromTo("#cta-logo", { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "elastic.out(1,0.5)" }, 16.5);
    tl.to("#cta-tagline", { opacity: 1, duration: 0.5 }, 17.0);
    tl.to("#cta-link", { opacity: 1, duration: 0.5 }, 18.0);
  </script>
</div>
</body>
</html>
