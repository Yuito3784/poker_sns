<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0d1009; font-family: 'Noto Sans JP', sans-serif; }
    .item-card { background: #131a14; border: 1px solid #2a3828; border-radius: 20px; padding: 40px; margin: 0 60px; }
    .number { display: inline-flex; align-items: center; justify-content: center; width: 64px; height: 64px; border-radius: 50%; border: 2px solid #c9a84c; color: #c9a84c; font-size: 32px; font-weight: 900; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="reel-05" data-start="0" data-duration="14" data-width="1080" data-height="1920">

    <div id="bg" class="clip" data-start="0" data-duration="14" data-track-index="0"
      style="position:absolute;inset:0;background:radial-gradient(circle at 50% 40%, rgba(201,168,76,0.06) 0%, transparent 60%);">
    </div>

    <!-- Hook -->
    <div id="hook" class="clip" data-start="0" data-duration="2.5" data-track-index="1"
      style="position:absolute;top:380px;left:0;right:0;text-align:center;padding:0 60px;">
      <p style="font-size:60px;font-weight:900;color:#ddd6c8;line-height:1.3;">
        ポーカー始めて<br/><span style="color:#c9a84c;">人生変わった</span><br/>3つのこと
      </p>
    </div>

    <!-- Item 1 -->
    <div id="item1" class="clip" data-start="2.5" data-duration="3" data-track-index="2"
      style="position:absolute;top:350px;left:0;right:0;">
      <div class="item-card">
        <div style="display:flex;align-items:center;gap:20px;margin-bottom:16px;">
          <span class="number">1</span>
          <p style="font-size:40px;font-weight:900;color:#ddd6c8;">期待値で考える</p>
        </div>
        <p style="font-size:32px;color:#9a8e7a;line-height:1.5;padding-left:84px;">
          日常の判断が全部<br/>EV計算になる
        </p>
      </div>
    </div>

    <!-- Item 2 -->
    <div id="item2" class="clip" data-start="5.5" data-duration="3" data-track-index="3"
      style="position:absolute;top:350px;left:0;right:0;">
      <div class="item-card">
        <div style="display:flex;align-items:center;gap:20px;margin-bottom:16px;">
          <span class="number">2</span>
          <p style="font-size:40px;font-weight:900;color:#ddd6c8;">感情コントロール</p>
        </div>
        <p style="font-size:32px;color:#9a8e7a;line-height:1.5;padding-left:84px;">
          ティルトしなくなった<br/>（仕事でも）
        </p>
      </div>
    </div>

    <!-- Item 3 -->
    <div id="item3" class="clip" data-start="8.5" data-duration="3" data-track-index="4"
      style="position:absolute;top:350px;left:0;right:0;">
      <div class="item-card">
        <div style="display:flex;align-items:center;gap:20px;margin-bottom:16px;">
          <span class="number">3</span>
          <p style="font-size:40px;font-weight:900;color:#ddd6c8;">仲間ができた</p>
        </div>
        <p style="font-size:32px;color:#9a8e7a;line-height:1.5;padding-left:84px;">
          ポーカーのコミュニティは<br/>最高
        </p>
      </div>
    </div>

    <!-- CTA -->
    <div id="cta" class="clip" data-start="11.5" data-duration="2.5" data-track-index="5"
      style="position:absolute;top:400px;left:0;right:0;text-align:center;padding:0 60px;">
      <p style="font-size:44px;color:#ddd6c8;line-height:1.4;">その仲間、</p>
      <p style="font-size:72px;font-weight:900;color:#c9a84c;margin-top:16px;">PokerTALK</p>
      <p style="font-size:44px;color:#ddd6c8;margin-top:16px;">で見つけよう。</p>
      <p style="font-size:28px;color:#6b7a66;margin-top:24px;">リンクはプロフから</p>
    </div>

  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    tl.from("#hook", { opacity: 0, y: 30, duration: 0.5 }, 0);
    tl.to("#hook", { opacity: 0, duration: 0.3 }, 2.2);
    tl.from("#item1", { opacity: 0, x: -40, duration: 0.5 }, 2.5);
    tl.to("#item1", { opacity: 0, x: 40, duration: 0.3 }, 5.2);
    tl.from("#item2", { opacity: 0, x: -40, duration: 0.5 }, 5.5);
    tl.to("#item2", { opacity: 0, x: 40, duration: 0.3 }, 8.2);
    tl.from("#item3", { opacity: 0, x: -40, duration: 0.5 }, 8.5);
    tl.to("#item3", { opacity: 0, x: 40, duration: 0.3 }, 11.2);
    tl.from("#cta", { opacity: 0, scale: 0.9, duration: 0.6 }, 11.5);

    window.__timelines["reel-05"] = tl;
  </script>
</body>
</html>
