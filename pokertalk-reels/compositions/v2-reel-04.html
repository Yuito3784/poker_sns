<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; font-family: 'Noto Sans JP', sans-serif; }

    .bg {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 50% 40%, #1a0f0f 0%, #120a0a 60%, #0a0505 100%);
    }
    .bg::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(circle at 30% 25%, rgba(255,200,80,0.02) 0%, transparent 30%),
                  radial-gradient(circle at 75% 70%, rgba(255,180,60,0.015) 0%, transparent 25%),
                  radial-gradient(circle at 60% 20%, rgba(255,160,40,0.01) 0%, transparent 20%);
    }

    .grain { position: absolute; inset: 0; opacity: 0.03; pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .safe { position: absolute; top: 150px; bottom: 200px; left: 60px; right: 60px; }
    .clip { position: absolute; opacity: 0; }
    .fukuro { text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000; }

    .progress-bar { position: absolute; bottom: 100px; left: 60px; right: 60px; height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px; }
    .progress-fill { height: 100%; width: 0%; background: #c9a84c; border-radius: 2px; }

    .flash { position: absolute; inset: 0; background: white; opacity: 0; pointer-events: none; z-index: 100; }

    .item-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 28px 32px;
      margin-bottom: 20px;
      display: flex; align-items: center; gap: 20px;
    }
    .item-num {
      display: inline-flex; align-items: center; justify-content: center;
      width: 52px; height: 52px; border-radius: 50%;
      background: linear-gradient(135deg, #c9a84c, #a08030);
      color: #fff; font-size: 28px; font-weight: 900; flex-shrink: 0;
    }
  </style>
</head>
<body>
<div id="root" data-composition-id="v2-reel-04" data-start="0" data-duration="20" data-width="1080" data-height="1920">
  <div class="bg"></div>
  <div class="grain"></div>
  <div class="flash" id="flash1"></div>
  <div class="safe">

    <!-- HOOK 0-3.5s -->
    <div class="clip" id="hook" data-start="0" data-duration="3.5" data-track-index="0">
      <div style="position:absolute; top:100px; left:0;">
        <div style="color:#fff; font-size:40px; font-weight:400;">ライブポーカー初めて行った時の</div>
      </div>
      <div id="hook-big" style="position:absolute; top:300px; left:0; right:0; text-align:center; opacity:0;">
        <div style="color:#FFE136; font-size:80px; font-weight:900; transform:rotate(-1.5deg);" class="fukuro">チップ重すぎて草ｗｗｗ</div>
      </div>
      <div style="position:absolute; top:80px; right:20px; font-size:80px;">💰</div>
    </div>

    <!-- 5 and 4 (3.5-7s) -->
    <div class="clip" id="items54" data-start="3.5" data-duration="3.5" data-track-index="0">
      <div style="position:absolute; top:180px; left:0; right:0;">
        <div class="item-card" id="card5" style="transform:translateX(400px);">
          <div class="item-num">5</div>
          <div style="color:#fff; font-size:36px;">チップの重量感がリアルすぎる</div>
        </div>
        <div class="item-card" id="card4" style="transform:translateX(-400px);">
          <div class="item-num">4</div>
          <div style="color:#fff; font-size:36px;">ディーラーの手さばき速すぎて草</div>
        </div>
      </div>
    </div>

    <!-- 3 and 2 (7-10.5s) -->
    <div class="clip" id="items32" data-start="7" data-duration="3.5" data-track-index="0">
      <div style="position:absolute; top:180px; left:0; right:0;">
        <div class="item-card" id="card3" style="transform:translateX(400px);">
          <div class="item-num">3</div>
          <div style="color:#fff; font-size:36px;">常連怖い<span style="color:#888; font-size:28px;">（最初だけ）</span></div>
        </div>
        <div class="item-card" id="card2" style="transform:translateX(-400px);">
          <div class="item-num">2</div>
          <div style="color:#fff; font-size:36px;">テーブルトーク、<span style="color:#FF3B3B; font-weight:700;">何語？？</span></div>
        </div>
      </div>
    </div>

    <!-- 1 (10.5-14s) -->
    <div class="clip" id="item1" data-start="10.5" data-duration="3.5" data-track-index="0">
      <div style="position:absolute; top:200px; left:0; right:0; text-align:center;">
        <div style="color:#fff; font-size:48px; font-weight:700;">① これ。</div>
        <div id="item1-big" style="margin-top:50px; opacity:0;">
          <div style="color:#FFE136; font-size:72px; font-weight:900;" class="fukuro">あの『カチッ』って音</div>
          <div id="item1-fire" style="color:#FF3B3B; font-size:56px; font-weight:900; margin-top:20px;">中毒性やばい🔥</div>
        </div>
      </div>
    </div>

    <!-- BRIDGE 14-16.5s -->
    <div class="clip" id="bridge" data-start="14" data-duration="2.5" data-track-index="0">
      <div style="position:absolute; top:300px; left:0; right:0; text-align:center;">
        <div style="color:#fff; font-size:52px; font-weight:700;">初めてでも全然OK。</div>
        <div style="color:#4ECBFF; font-size:52px; font-weight:700; margin-top:20px;">仲間がいるから。</div>
      </div>
    </div>

    <!-- CTA 16.5-20s -->
    <div class="clip" id="cta" data-start="16.5" data-duration="3.5" data-track-index="0">
      <div style="position:absolute; top:300px; left:0; right:0; text-align:center;">
        <div id="cta-logo" style="color:#c9a84c; font-size:80px; font-weight:900; opacity:0;">PokerTALK</div>
        <div id="cta-tagline" style="color:#fff; font-size:32px; margin-top:30px; opacity:0;">テーブルの外でも、ポーカーを語ろう</div>
        <div id="cta-link" style="color:#888; font-size:24px; margin-top:30px; opacity:0;">↓ プロフのリンクから</div>
      </div>
    </div>

  </div>

  <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["v2-reel-04"] = tl;

    tl.to("#progress", { width: "100%", duration: 20, ease: "none" }, 0);

    // HOOK
    tl.to("#hook", { opacity: 1, duration: 0.3 }, 0);
    tl.to("#flash1", { opacity: 0.7, duration: 0.05 }, 0.6);
    tl.to("#flash1", { opacity: 0, duration: 0.15 }, 0.65);
    tl.to("#hook", { x: 5, duration: 0.05, yoyo: true, repeat: 3 }, 0.6);
    tl.to("#hook", { x: 0, duration: 0.05 }, 0.9);
    tl.to("#hook-big", { opacity: 1, duration: 0.3 }, 0.8);
    tl.to("#hook", { opacity: 0, duration: 0.3 }, 3.2);

    // Items 5 & 4
    tl.to("#items54", { opacity: 1, duration: 0.1 }, 3.5);
    tl.to("#card5", { x: 0, duration: 0.5, ease: "back.out(1.2)" }, 3.5);
    tl.to("#card4", { x: 0, duration: 0.5, ease: "back.out(1.2)" }, 5.5);
    tl.to("#items54", { opacity: 0, duration: 0.3 }, 6.7);

    // Items 3 & 2
    tl.to("#items32", { opacity: 1, duration: 0.1 }, 7);
    tl.to("#card3", { x: 0, duration: 0.5, ease: "back.out(1.2)" }, 7);
    tl.to("#card2", { x: 0, duration: 0.5, ease: "back.out(1.2)" }, 9);
    tl.to("#items32", { opacity: 0, duration: 0.3 }, 10.2);

    // Item 1
    tl.to("#flash1", { opacity: 0.8, duration: 0.05 }, 10.5);
    tl.to("#flash1", { opacity: 0, duration: 0.15 }, 10.55);
    tl.to("#item1", { opacity: 1, duration: 0.3 }, 10.5);
    tl.to("#item1-big", { opacity: 1, duration: 0.4 }, 11.5);
    // shake on fire
    tl.to("#item1-fire", { x: 5, duration: 0.05, yoyo: true, repeat: 5 }, 12);
    tl.to("#item1-fire", { x: 0, duration: 0.05 }, 12.3);
    tl.to("#item1", { opacity: 0, duration: 0.3 }, 13.7);

    // BRIDGE
    tl.to("#bridge", { opacity: 1, duration: 0.3 }, 14);
    tl.to("#bridge", { opacity: 0, duration: 0.3 }, 16.2);

    // CTA
    tl.to("#cta", { opacity: 1, duration: 0.1 }, 16.5);
    tl.fromTo("#cta-logo", { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "elastic.out(1,0.5)" }, 16.5);
    tl.to("#cta-tagline", { opacity: 1, duration: 0.5 }, 17.0);
    tl.to("#cta-link", { opacity: 1, duration: 0.5 }, 18.0);
  </script>
</div>
</body>
</html>
