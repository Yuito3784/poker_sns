<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; font-family: 'Noto Sans JP', sans-serif; }

    .bg {
      position: absolute; inset: 0;
      background: #0d0a14;
    }
    .bg::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(circle at 20% 30%, rgba(255,180,50,0.03) 0%, transparent 40%),
                  radial-gradient(circle at 70% 60%, rgba(255,160,40,0.025) 0%, transparent 35%),
                  radial-gradient(circle at 50% 80%, rgba(255,200,80,0.02) 0%, transparent 30%),
                  radial-gradient(circle at 85% 20%, rgba(255,140,60,0.02) 0%, transparent 25%);
    }

    .grain { position: absolute; inset: 0; opacity: 0.03; pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .safe { position: absolute; top: 150px; bottom: 200px; left: 60px; right: 60px; }
    .clip { position: absolute; opacity: 0; }
    .fukuro { text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000; }

    .progress-bar { position: absolute; bottom: 100px; left: 60px; right: 60px; height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px; }
    .progress-fill { height: 100%; width: 0%; background: #c9a84c; border-radius: 2px; }

    .flash { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 100; }

    .shock-box { display: inline-block; background: rgba(255,59,59,0.2); border: 2px solid #FF3B3B; padding: 4px 16px; border-radius: 6px; }
  </style>
</head>
<body>
<div id="root" data-composition-id="v2-reel-02" data-start="0" data-duration="20" data-width="1080" data-height="1920">
  <div class="bg"></div>
  <div class="grain"></div>
  <div class="flash" id="flash1"></div>
  <div class="safe">

    <!-- HOOK 0-3.5s -->
    <div class="clip" id="hook" data-start="0" data-duration="3.5" data-track-index="0">
      <div style="position:absolute; top:150px; left:0;">
        <div class="shock-box" style="font-size:36px; color:#FF3B3B; font-weight:900;">【衝撃】</div>
        <div style="color:#fff; font-size:52px; font-weight:700; margin-top:20px;">ポーカー始めて半年で...</div>
        <div id="hook-big" style="color:#FFE136; font-size:72px; font-weight:900; transform:rotate(-1deg); margin-top:30px; opacity:0;" class="fukuro">トーナメント優勝したんだが？？</div>
      </div>
      <div id="trophy" style="position:absolute; top:100px; right:20px; font-size:100px; opacity:0;">🏆</div>
    </div>

    <!-- PROBLEM 3.5-7.5s -->
    <div class="clip" id="problem" data-start="3.5" data-duration="4" data-track-index="0">
      <div style="position:absolute; top:200px; right:0; text-align:right; width:100%;">
        <div style="color:#fff; font-size:44px; font-weight:700;">でも周りに言っても</div>
        <div id="problem-quote" style="color:#888; font-size:60px; font-style:italic; margin-top:40px; opacity:0;">'は？ポーカー？'</div>
        <div id="problem-face" style="color:#fff; font-size:40px; margin-top:20px; opacity:0;">って顔される</div>
      </div>
      <div style="position:absolute; top:350px; left:20px; font-size:80px;">😐</div>
    </div>

    <!-- EMOTION 7.5-11.5s -->
    <div class="clip" id="emotion" data-start="7.5" data-duration="4" data-track-index="0">
      <div style="position:absolute; top:250px; left:0;">
        <div style="color:#fff; font-size:44px; font-weight:700;">ポーカーは</div>
        <div style="margin-top:20px;">
          <span style="color:#FFE136; font-size:72px; font-weight:900; text-decoration:underline wavy #FFE136; text-underline-offset:12px; transform:rotate(1deg); display:inline-block;">実力ゲーム</span>
        </div>
        <div id="emotion-sub" style="color:#888; font-size:36px; margin-top:40px; opacity:0;">なのに伝わらない...</div>
      </div>
    </div>

    <!-- SOLUTION 11.5-14.5s -->
    <div class="clip" id="solution" data-start="11.5" data-duration="3" data-track-index="0">
      <div style="position:absolute; top:300px; left:0; right:0; text-align:center;">
        <div><span style="color:#FF3B3B; font-size:56px; font-weight:900;">この熱量</span></div>
        <div style="color:#fff; font-size:44px; font-weight:700; margin-top:20px;">分かってくれる場所がほしかった。</div>
      </div>
    </div>

    <!-- BRIDGE 14.5-16.5s -->
    <div class="clip" id="bridge" data-start="14.5" data-duration="2" data-track-index="0">
      <div style="position:absolute; top:350px; left:0; right:0; text-align:center;">
        <div id="bridge-text" style="color:#fff; font-size:64px; font-weight:900;">だから作った。</div>
      </div>
    </div>

    <!-- CTA 16.5-20s -->
    <div class="clip" id="cta" data-start="16.5" data-duration="3.5" data-track-index="0">
      <div style="position:absolute; top:300px; left:0; right:0; text-align:center;">
        <div id="cta-logo" style="color:#c9a84c; font-size:80px; font-weight:900; opacity:0;">PokerTALK</div>
        <div id="cta-tagline" style="color:#fff; font-size:32px; margin-top:30px; opacity:0;">テーブルの外でも、ポーカーを語ろう</div>
        <div id="cta-link" style="color:#888; font-size:24px; margin-top:30px; opacity:0;">↓ プロフのリンクから</div>
      </div>
    </div>

  </div>

  <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["v2-reel-02"] = tl;

    tl.to("#progress", { width: "100%", duration: 20, ease: "none" }, 0);

    // HOOK
    tl.to("#hook", { opacity: 1, duration: 0.3 }, 0);
    tl.to("#hook-big", { opacity: 1, duration: 0.4 }, 1.2);
    tl.to("#trophy", { opacity: 1, duration: 0.3 }, 1.4);
    tl.to("#trophy", { y: -10, duration: 0.4, yoyo: true, repeat: 3, ease: "sine.inOut" }, 1.5);
    tl.to("#hook", { opacity: 0, duration: 0.3 }, 3.2);

    // PROBLEM
    tl.to("#problem", { opacity: 1, duration: 0.3 }, 3.5);
    tl.to("#problem-quote", { opacity: 1, duration: 0.4 }, 5.5);
    tl.to("#problem-face", { opacity: 1, duration: 0.3 }, 6.0);
    tl.to("#problem", { opacity: 0, duration: 0.3 }, 7.2);

    // EMOTION
    tl.to("#emotion", { opacity: 1, duration: 0.3 }, 7.5);
    tl.to("#emotion-sub", { opacity: 1, duration: 0.5 }, 9.5);
    tl.to("#emotion", { opacity: 0, duration: 0.3 }, 11.2);

    // SOLUTION
    tl.to("#flash1", { opacity: 1, duration: 0.1 }, 11.5);
    tl.to("#flash1", { opacity: 0, duration: 0.2 }, 11.6);
    tl.to("#solution", { opacity: 1, duration: 0.3 }, 11.7);
    tl.to("#solution", { opacity: 0, duration: 0.3 }, 14.2);

    // BRIDGE
    tl.to("#bridge", { opacity: 1, duration: 0.3 }, 14.5);
    tl.fromTo("#bridge-text", { scale: 0.8 }, { scale: 1, duration: 0.5, ease: "back.out(1.5)" }, 14.5);
    tl.to("#bridge", { opacity: 0, duration: 0.3 }, 16.2);

    // CTA
    tl.to("#cta", { opacity: 1, duration: 0.1 }, 16.5);
    tl.fromTo("#cta-logo", { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "elastic.out(1,0.5)" }, 16.5);
    tl.to("#cta-tagline", { opacity: 1, duration: 0.5 }, 17.0);
    tl.to("#cta-link", { opacity: 1, duration: 0.5 }, 18.0);
  </script>
</div>
</body>
</html>
