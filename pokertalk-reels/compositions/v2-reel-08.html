<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; font-family: 'Noto Sans JP', sans-serif; }

    .bg {
      position: absolute; inset: 0;
      background: #0f0a06;
    }
    .bg::after {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse at 20% 80%, rgba(200,120,40,0.08) 0%, transparent 50%);
    }
    .bg-texture {
      position: absolute; inset: 0; opacity: 0.02;
      background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='40' height='40' fill='none' stroke='%23fff' stroke-width='0.3'/%3E%3C/svg%3E");
    }

    .grain { position: absolute; inset: 0; opacity: 0.03; pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .safe { position: absolute; top: 150px; bottom: 200px; left: 60px; right: 60px; }
    .clip { position: absolute; opacity: 0; }
    .fukuro { text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000; }

    .progress-bar { position: absolute; bottom: 100px; left: 60px; right: 60px; height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px; }
    .progress-fill { height: 100%; width: 0%; background: #c9a84c; border-radius: 2px; }

    .flash { position: absolute; inset: 0; background: white; opacity: 0; pointer-events: none; z-index: 100; }

    .underline-cyan {
      border-bottom: 4px solid #4ECBFF; padding-bottom: 4px;
    }
  </style>
</head>
<body>
<div id="root" data-composition-id="v2-reel-08" data-start="0" data-duration="20" data-width="1080" data-height="1920">
  <div class="bg"></div>
  <div class="bg-texture"></div>
  <div class="grain"></div>
  <div class="flash" id="flash1"></div>
  <div class="safe">

    <!-- HOOK 0-3.5s -->
    <div class="clip" id="hook" data-start="0" data-duration="3.5" data-track-index="0">
      <div style="position:absolute; top:200px; left:0; right:0; text-align:center;">
        <div style="position:relative; display:inline-block;">
          <span style="color:#fff; font-size:56px; font-weight:700;">ポーカー＝ギャンブル</span>
          <div id="strike-line" style="position:absolute; left:-5px; right:-5px; top:50%; height:6px; background:#FF3B3B; transform:scaleX(0); transform-origin:left;"></div>
        </div>
        <div style="color:#fff; font-size:44px; font-weight:700; margin-top:30px;">とか言ってる奴、</div>
        <div id="hook-impact" style="color:#FFE136; font-size:72px; font-weight:900; transform:rotate(-1.5deg); margin-top:20px;" class="fukuro">ちょっとこい。</div>
      </div>
    </div>

    <!-- FACT 1: 3.5-7s -->
    <div class="clip" id="fact1" data-start="3.5" data-duration="3.5" data-track-index="0">
      <div style="position:absolute; top:180px; left:0;">
        <div style="color:#fff; font-size:40px; font-weight:700;">ポーカーは</div>
        <div style="margin-top:20px;">
          <span class="underline-cyan" style="color:#4ECBFF; font-size:56px; font-weight:900;">'不完全情報ゲーム'</span>
        </div>
        <div id="fact1-detail" style="margin-top:40px; opacity:0;">
          <div style="color:#888; font-size:32px;">将棋→全部見える</div>
          <div style="color:#FFE136; font-size:40px; font-weight:700; margin-top:15px;">ポーカー→見えない</div>
        </div>
      </div>
    </div>

    <!-- FACT 2: 7-10.5s -->
    <div class="clip" id="fact2" data-start="7" data-duration="3.5" data-track-index="0">
      <div style="position:absolute; top:200px; left:60px;">
        <div style="color:#fff; font-size:40px; font-weight:700;">だから</div>
        <div style="margin-top:20px;">
          <span id="f2-yomi" style="color:#FFE136; font-size:64px; font-weight:900; opacity:0;">'読み'</span>
          <span style="color:#fff; font-size:40px; font-weight:700;"> と </span>
          <span id="f2-math" style="color:#4ECBFF; font-size:64px; font-weight:900; opacity:0;">'数学'</span>
        </div>
        <div style="color:#fff; font-size:48px; font-weight:700; margin-top:20px;">で戦う。</div>
      </div>
    </div>

    <!-- FACT 3: 10.5-14s -->
    <div class="clip" id="fact3" data-start="10.5" data-duration="3.5" data-track-index="0">
      <div style="position:absolute; top:200px; left:0; right:0; text-align:center;">
        <div style="color:#FF3B3B; font-size:48px; font-weight:700;">1回は負ける。</div>
        <div id="f3-win" style="color:#FFE136; font-size:56px; font-weight:900; margin-top:30px; opacity:0;">でも100回で勝つ。</div>
        <div id="f3-reason" style="margin-top:40px; opacity:0;">
          <div style="color:#fff; font-size:40px;">経営者がハマる理由、</div>
          <div style="color:#FFE136; font-size:56px; font-weight:900; margin-top:10px; text-shadow:0 0 20px rgba(255,225,54,0.4);">分かった？</div>
        </div>
      </div>
    </div>

    <!-- BRIDGE 14-16.5s -->
    <div class="clip" id="bridge" data-start="14" data-duration="2.5" data-track-index="0">
      <div style="position:absolute; top:350px; left:0; right:0; text-align:center;">
        <div style="color:#fff; font-size:56px; font-weight:700;">始めてみたい？</div>
        <div style="color:#4ECBFF; font-size:40px; margin-top:30px;">仲間がいる場所、あるよ。</div>
      </div>
    </div>

    <!-- CTA 16.5-20s -->
    <div class="clip" id="cta" data-start="16.5" data-duration="3.5" data-track-index="0">
      <div style="position:absolute; top:300px; left:0; right:0; text-align:center;">
        <div id="cta-logo" style="color:#c9a84c; font-size:80px; font-weight:900; opacity:0;">PokerTALK</div>
        <div id="cta-tagline" style="color:#fff; font-size:32px; margin-top:30px; opacity:0;">テーブルの外でも、ポーカーを語ろう</div>
        <div id="cta-link" style="color:#888; font-size:24px; margin-top:30px; opacity:0;">↓ プロフのリンクから</div>
      </div>
    </div>

  </div>

  <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["v2-reel-08"] = tl;

    // Progress bar
    tl.to("#progress", { width: "100%", duration: 20, ease: "none" }, 0);

    // HOOK
    tl.to("#hook", { opacity: 1, duration: 0.3 }, 0);
    tl.to("#strike-line", { scaleX: 1, duration: 0.4, ease: "power2.out" }, 1.0);
    tl.to("#hook-impact", { x: 5, duration: 0.05, yoyo: true, repeat: 5 }, 1.8);
    tl.to("#hook-impact", { x: 0, duration: 0.05 }, 2.1);
    tl.to("#hook", { opacity: 0, duration: 0.3 }, 3.2);

    // FACT 1
    tl.to("#fact1", { opacity: 1, duration: 0.3 }, 3.5);
    tl.to("#fact1-detail", { opacity: 1, duration: 0.4 }, 5.0);
    tl.to("#fact1", { opacity: 0, duration: 0.3 }, 6.7);

    // FACT 2
    tl.to("#fact2", { opacity: 1, duration: 0.3 }, 7);
    tl.to("#f2-yomi", { opacity: 1, duration: 0.2 }, 7.5);
    tl.to("#flash1", { opacity: 0.5, duration: 0.05 }, 7.5);
    tl.to("#flash1", { opacity: 0, duration: 0.15 }, 7.55);
    tl.to("#f2-math", { opacity: 1, duration: 0.2 }, 8.2);
    tl.to("#flash1", { opacity: 0.5, duration: 0.05 }, 8.2);
    tl.to("#flash1", { opacity: 0, duration: 0.15 }, 8.25);
    tl.to("#fact2", { opacity: 0, duration: 0.3 }, 10.2);

    // FACT 3
    tl.to("#fact3", { opacity: 1, duration: 0.3 }, 10.5);
    tl.to("#f3-win", { opacity: 1, scale: 1.05, duration: 0.4 }, 12.0);
    tl.to("#f3-win", { scale: 1, duration: 0.2 }, 12.4);
    tl.to("#f3-reason", { opacity: 1, duration: 0.4 }, 12.8);
    tl.to("#fact3", { opacity: 0, duration: 0.3 }, 13.7);

    // BRIDGE
    tl.to("#bridge", { opacity: 1, duration: 0.3 }, 14);
    tl.to("#bridge", { opacity: 0, duration: 0.3 }, 16.2);

    // CTA
    tl.to("#cta", { opacity: 1, duration: 0.1 }, 16.5);
    tl.fromTo("#cta-logo", { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "elastic.out(1,0.5)" }, 16.5);
    tl.to("#cta-tagline", { opacity: 1, duration: 0.5 }, 17.0);
    tl.to("#cta-link", { opacity: 1, duration: 0.5 }, 18.0);
  </script>
</div>
</body>
</html>
