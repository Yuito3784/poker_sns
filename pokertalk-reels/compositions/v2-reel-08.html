<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Inter:wght@400;700;900&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0a0d08; font-family: 'Noto Sans JP', sans-serif; }

    .grain { position: absolute; inset: 0; opacity: 0.03; pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .safe { position: absolute; top: 150px; bottom: 250px; left: 60px; right: 60px; }
    .glow-gold { text-shadow: 0 0 20px rgba(201,168,76,0.4), 0 0 40px rgba(201,168,76,0.2); }

    .progress-bar { position: absolute; bottom: 260px; left: 60px; right: 60px; height: 4px;
      background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; }
    .progress-fill { height: 100%; background: #c9a84c; border-radius: 2px; width: 0%; }

    .watermark { position: absolute; bottom: 270px; right: 60px; font-size: 20px;
      font-weight: 700; color: rgba(201,168,76,0.3); font-family: 'Inter', sans-serif;
      letter-spacing: 1px; }

    .strikethrough-line {
      position: absolute; left: 0; top: 50%; width: 0; height: 6px;
      background: #c0392b; transform: translateY(-50%);
    }
  </style>
</head>
<body>
  <div id="root" data-composition-id="v2-reel-08" data-start="0" data-duration="12" data-width="1080" data-height="1920">

    <!-- BG -->
    <div id="bg" class="clip" data-start="0" data-duration="12" data-track-index="0"
      style="position:absolute;inset:0;">
      <div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%, rgba(201,168,76,0.04) 0%, transparent 50%);"></div>
    </div>

    <!-- Grain -->
    <div id="grain-layer" class="clip" data-start="0" data-duration="12" data-track-index="1"
      style="position:absolute;inset:0;"><div class="grain"></div></div>

    <!-- SCENE 1: HOOK (0-3s) -->
    <div id="scene1" class="clip" data-start="0" data-duration="3" data-track-index="2"
      style="position:absolute;inset:0;">
      <div class="safe" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;">
        <div id="s1-strike" style="text-align:center;position:relative;display:inline-block;">
          <p style="font-size:72px;font-weight:900;color:#fff;line-height:1.3;letter-spacing:2px;">'ポーカー＝ギャンブル'</p>
          <div id="s1-strike-line" class="strikethrough-line"></div>
        </div>
        <div id="s1-gold" style="text-align:center;">
          <p style="font-size:64px;font-weight:900;color:#c9a84c;line-height:1.3;" class="glow-gold">だと思ってる人へ。</p>
        </div>
        <div id="s1-small" style="text-align:center;">
          <p style="font-size:36px;font-weight:700;color:#9a8e7a;line-height:1.4;">30秒で考え変わる。</p>
        </div>
      </div>
    </div>

    <!-- SCENE 2: Kinetic Typography (3-9s) -->
    <div id="scene2" class="clip" data-start="3" data-duration="6" data-track-index="3"
      style="position:absolute;inset:0;">
      <div class="safe" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;">
        <div id="s2-line1" style="text-align:center;position:absolute;top:150px;left:0;right:0;">
          <p style="font-size:56px;font-weight:900;color:#fff;line-height:1.3;">ポーカーは <span style="color:#c9a84c;">'不完全情報ゲーム'</span></p>
        </div>
        <div id="s2-line2" style="text-align:center;position:absolute;top:150px;left:0;right:0;">
          <p style="font-size:48px;font-weight:700;color:#9a8e7a;line-height:1.4;">将棋は全部見える。<br/>ポーカーは見えない。</p>
        </div>
        <div id="s2-line3" style="text-align:center;position:absolute;top:150px;left:0;right:0;">
          <p style="font-size:52px;font-weight:900;color:#ddd6c8;line-height:1.4;">だから <span style="color:#c9a84c;">'読み'</span> と <span style="color:#c9a84c;">'数学'</span> で戦う</p>
        </div>
        <div id="s2-line4" style="text-align:center;position:absolute;top:150px;left:0;right:0;">
          <p style="font-size:54px;font-weight:900;color:#fff;line-height:1.3;">1回は負ける。<br/>100回で勝つ。</p>
        </div>
        <div id="s2-line5" style="text-align:center;position:absolute;top:150px;left:0;right:0;">
          <p style="font-size:60px;font-weight:900;color:#c9a84c;line-height:1.3;" class="glow-gold">経営者がハマる理由、<br/>分かった？</p>
        </div>
      </div>
    </div>

    <!-- SCENE 3: Question (9-10.5s) -->
    <div id="scene3" class="clip" data-start="9" data-duration="1.5" data-track-index="4"
      style="position:absolute;inset:0;">
      <div class="safe" style="display:flex;flex-direction:column;align-items:center;justify-content:center;">
        <div id="s3-text" style="text-align:center;">
          <p style="font-size:68px;font-weight:900;color:#ddd6c8;line-height:1.3;">始めてみたい？</p>
        </div>
      </div>
    </div>

    <!-- SCENE 4: CTA (10.5-12s) -->
    <div id="scene4" class="clip" data-start="10.5" data-duration="1.5" data-track-index="5"
      style="position:absolute;inset:0;">
      <div class="safe" style="display:flex;flex-direction:column;align-items:center;justify-content:center;">
        <div id="s4-cta" style="text-align:center;">
          <p style="font-size:80px;font-weight:900;color:#c9a84c;letter-spacing:2px;font-family:'Inter',sans-serif;" class="glow-gold">PokerTALK</p>
          <p style="font-size:28px;color:#6b7a66;margin-top:20px;">↓ プロフのリンクから</p>
        </div>
      </div>
    </div>

    <!-- Progress bar -->
    <div id="progress" class="clip" data-start="0" data-duration="12" data-track-index="6"
      style="position:absolute;inset:0;pointer-events:none;">
      <div class="progress-bar"><div class="progress-fill" id="prog-fill"></div></div>
    </div>

    <!-- Watermark -->
    <div id="wm" class="clip" data-start="0" data-duration="12" data-track-index="7"
      style="position:absolute;inset:0;pointer-events:none;">
      <div class="watermark">PokerTALK</div>
    </div>

    <!-- Flash transitions -->
    <div id="flash1" class="clip" data-start="2.8" data-duration="0.4" data-track-index="8"
      style="position:absolute;inset:0;background:#c9a84c;opacity:0;pointer-events:none;"></div>
    <div id="flash2" class="clip" data-start="8.8" data-duration="0.4" data-track-index="9"
      style="position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;"></div>
    <div id="flash3" class="clip" data-start="10.3" data-duration="0.4" data-track-index="10"
      style="position:absolute;inset:0;background:#c9a84c;opacity:0;pointer-events:none;"></div>

  </div>

  <script>
    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    /* --- SCENE 1: HOOK (0-3s) --- */
    // Strike text appears
    tl.from("#s1-strike", { opacity: 0, y: 30, duration: 0.5, ease: "power4.out" }, 0.2);
    // Strikethrough line animates across
    tl.to("#s1-strike-line", { width: "100%", duration: 0.4, ease: "power4.out" }, 0.9);
    // Gold text appears
    tl.from("#s1-gold", { opacity: 0, y: 40, duration: 0.5, ease: "back.out(2)" }, 1.4);
    // Small text
    tl.from("#s1-small", { opacity: 0, duration: 0.4, ease: "power4.out" }, 2.0);

    // Flash 1
    tl.to("#flash1", { opacity: 0.6, duration: 0.1, ease: "power4.in" }, 2.9);
    tl.to("#flash1", { opacity: 0, duration: 0.2, ease: "power2.out" }, 3.0);

    /* --- SCENE 2: Kinetic Typography (3-9s) --- */
    // All lines start hidden
    gsap.set(["#s2-line1","#s2-line2","#s2-line3","#s2-line4","#s2-line5"], { opacity: 0 });

    // Line 1: "不完全情報ゲーム" (3-4.2s)
    tl.to("#s2-line1", { opacity: 1, duration: 0.01 }, 3.1);
    tl.from("#s2-line1", { y: 60, duration: 0.5, ease: "power4.out" }, 3.1);
    tl.to("#s2-line1", { opacity: 0, y: -40, duration: 0.3, ease: "power4.in" }, 4.0);

    // Line 2: "将棋は全部見える..." (4.2-5.4s)
    tl.to("#s2-line2", { opacity: 1, duration: 0.01 }, 4.3);
    tl.from("#s2-line2", { y: 60, duration: 0.5, ease: "power4.out" }, 4.3);
    tl.to("#s2-line2", { opacity: 0, y: -40, duration: 0.3, ease: "power4.in" }, 5.2);

    // Line 3: "読みと数学で戦う" (5.4-6.6s)
    tl.to("#s2-line3", { opacity: 1, duration: 0.01 }, 5.5);
    tl.from("#s2-line3", { y: 60, duration: 0.5, ease: "back.out(2)" }, 5.5);
    tl.to("#s2-line3", { opacity: 0, y: -40, duration: 0.3, ease: "power4.in" }, 6.4);

    // Line 4: "1回は負ける。100回で勝つ。" (6.6-7.8s)
    tl.to("#s2-line4", { opacity: 1, duration: 0.01 }, 6.7);
    tl.from("#s2-line4", { y: 60, duration: 0.5, ease: "power4.out" }, 6.7);
    tl.to("#s2-line4", { opacity: 0, y: -40, duration: 0.3, ease: "power4.in" }, 7.6);

    // Line 5: "経営者がハマる理由" (7.8-9s)
    tl.to("#s2-line5", { opacity: 1, duration: 0.01 }, 7.9);
    tl.from("#s2-line5", { scale: 0.7, duration: 0.6, ease: "elastic.out(1, 0.5)" }, 7.9);

    // Flash 2
    tl.to("#flash2", { opacity: 0.6, duration: 0.1, ease: "power4.in" }, 8.9);
    tl.to("#flash2", { opacity: 0, duration: 0.2, ease: "power2.out" }, 9.0);

    /* --- SCENE 3: Question (9-10.5s) --- */
    tl.from("#s3-text", { opacity: 0, scale: 0.8, duration: 0.5, ease: "back.out(3)" }, 9.1);

    // Flash 3
    tl.to("#flash3", { opacity: 0.5, duration: 0.1, ease: "power4.in" }, 10.4);
    tl.to("#flash3", { opacity: 0, duration: 0.2, ease: "power2.out" }, 10.5);

    /* --- SCENE 4: CTA (10.5-12s) --- */
    tl.from("#s4-cta p:first-child", { opacity: 0, scale: 0.7, duration: 0.5, ease: "elastic.out(1, 0.5)" }, 10.6);
    tl.from("#s4-cta p:last-child", { opacity: 0, duration: 0.3 }, 11.1);

    // Progress bar
    tl.to("#prog-fill", { width: "100%", duration: 12, ease: "none" }, 0);

    window.__timelines["v2-reel-08"] = tl;
  </script>
</body>
</html>
