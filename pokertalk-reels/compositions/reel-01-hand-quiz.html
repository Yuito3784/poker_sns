<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0d1009; font-family: 'Noto Sans JP', sans-serif; }
    .card { width: 200px; height: 280px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 3px solid rgba(201,168,76,0.4); background: linear-gradient(135deg, #1a2318, #131a14); }
    .card-rank { font-size: 80px; font-weight: 900; line-height: 1; }
    .card-suit { font-size: 60px; line-height: 1; }
    .red { color: #c0392b; }
    .white { color: #ddd6c8; }
    .gold { color: #c9a84c; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="reel-01" data-start="0" data-duration="12" data-width="1080" data-height="1920">

    <!-- Background glow -->
    <div id="bg-glow" class="clip" data-start="0" data-duration="12" data-track-index="0"
      style="position:absolute;inset:0;background:radial-gradient(circle at 50% 40%, rgba(201,168,76,0.08) 0%, transparent 60%);">
    </div>

    <!-- Hook text -->
    <div id="hook" class="clip" data-start="0" data-duration="3" data-track-index="1"
      style="position:absolute;top:280px;left:0;right:0;text-align:center;padding:0 60px;">
      <p style="font-size:72px;font-weight:900;color:#ddd6c8;line-height:1.3;">
        AA持ってて<br/><span style="color:#c9a84c;">3bet入った。</span><br/>どうする？
      </p>
    </div>

    <!-- Cards -->
    <div id="cards" class="clip" data-start="1" data-duration="9" data-track-index="2"
      style="position:absolute;top:700px;left:0;right:0;display:flex;justify-content:center;gap:24px;">
      <div class="card">
        <span class="card-rank white">A</span>
        <span class="card-suit white">&#9824;</span>
      </div>
      <div class="card">
        <span class="card-rank red">A</span>
        <span class="card-suit red">&#9829;</span>
      </div>
    </div>

    <!-- Situation -->
    <div id="situation" class="clip" data-start="3" data-duration="4" data-track-index="3"
      style="position:absolute;top:320px;left:0;right:0;text-align:center;padding:0 60px;">
      <p style="font-size:48px;font-weight:700;color:#ddd6c8;line-height:1.4;">
        NL200 / 6max / CO<br/>
        <span style="color:#6b7a66;font-size:36px;">UTGが3x open → HJが3bet 10bb</span>
      </p>
    </div>

    <!-- Vote prompt -->
    <div id="vote" class="clip" data-start="3.5" data-duration="4" data-track-index="4"
      style="position:absolute;top:1100px;left:0;right:0;display:flex;justify-content:center;gap:40px;padding:0 80px;">
      <div style="flex:1;background:rgba(76,175,80,0.15);border:2px solid rgba(76,175,80,0.5);border-radius:16px;padding:30px;text-align:center;">
        <p style="font-size:48px;">👍</p>
        <p style="font-size:32px;font-weight:700;color:#4CAF50;margin-top:8px;">4bet</p>
        <p style="font-size:24px;color:#6b7a66;margin-top:4px;">コメント👍</p>
      </div>
      <div style="flex:1;background:rgba(244,67,54,0.15);border:2px solid rgba(244,67,54,0.5);border-radius:16px;padding:30px;text-align:center;">
        <p style="font-size:48px;">👎</p>
        <p style="font-size:32px;font-weight:700;color:#f44336;margin-top:8px;">コール</p>
        <p style="font-size:24px;color:#6b7a66;margin-top:4px;">コメント👎</p>
      </div>
    </div>

    <!-- Answer -->
    <div id="answer" class="clip" data-start="7.5" data-duration="3" data-track-index="5"
      style="position:absolute;top:280px;left:0;right:0;text-align:center;padding:0 60px;">
      <p style="font-size:56px;font-weight:900;color:#c9a84c;margin-bottom:24px;">正解：4bet一択</p>
      <p style="font-size:36px;color:#9a8e7a;line-height:1.5;">
        コールだとSPRが高すぎて<br/>ポストフロップが難しくなる。<br/>AAはプリフロで入れたい。
      </p>
    </div>

    <!-- CTA -->
    <div id="cta" class="clip" data-start="10" data-duration="2" data-track-index="6"
      style="position:absolute;bottom:200px;left:0;right:0;text-align:center;">
      <p style="font-size:36px;color:#6b7a66;">もっとハンド語りたいなら</p>
      <p style="font-size:56px;font-weight:900;color:#c9a84c;margin-top:12px;">PokerTALK</p>
      <p style="font-size:28px;color:#6b7a66;margin-top:8px;">プロフのリンクから</p>
    </div>

  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    tl.from("#hook", { opacity: 0, scale: 1.1, duration: 0.5 }, 0);
    tl.from("#cards .card", { opacity: 0, rotationY: 180, stagger: 0.2, duration: 0.6 }, 1);
    tl.to("#hook", { opacity: 0, y: -30, duration: 0.3 }, 2.7);
    tl.from("#situation", { opacity: 0, y: 20, duration: 0.5 }, 3);
    tl.from("#vote > div", { opacity: 0, y: 40, stagger: 0.2, duration: 0.5 }, 3.5);
    tl.to("#situation", { opacity: 0, duration: 0.3 }, 7);
    tl.to("#vote", { opacity: 0, duration: 0.3 }, 7);
    tl.from("#answer", { opacity: 0, scale: 0.9, duration: 0.5 }, 7.5);
    tl.to("#cards", { opacity: 0, duration: 0.3 }, 9.5);
    tl.to("#answer", { opacity: 0, duration: 0.3 }, 9.7);
    tl.from("#cta", { opacity: 0, y: 30, duration: 0.5 }, 10);

    window.__timelines["reel-01"] = tl;
  </script>
</body>
</html>
