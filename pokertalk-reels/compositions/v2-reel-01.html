<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; font-family: 'Noto Sans JP', sans-serif; }

    .bg {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at center, #0a1a0f 0%, #060d05 70%);
    }
    .bg::after {
      content: ''; position: absolute; inset: 0;
      background: repeating-radial-gradient(circle at 50% 50%, transparent 0px, transparent 40px, rgba(255,255,255,0.008) 41px, transparent 42px);
    }

    .grain { position: absolute; inset: 0; opacity: 0.03; pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .safe { position: absolute; top: 150px; bottom: 200px; left: 60px; right: 60px; }

    .clip { position: absolute; opacity: 0; }

    .fukuro { text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000; }

    .progress-bar { position: absolute; bottom: 100px; left: 60px; right: 60px; height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px; }
    .progress-fill { height: 100%; width: 0%; background: #c9a84c; border-radius: 2px; }

    .flash { position: absolute; inset: 0; background: white; opacity: 0; pointer-events: none; z-index: 100; }

    .vote-btn { display: inline-block; padding: 24px 48px; border-radius: 16px; font-size: 48px; font-weight: 900; color: #fff; }
    .vote-green { background: rgba(34,197,94,0.2); border: 3px solid rgba(34,197,94,0.6); box-shadow: 0 0 30px rgba(34,197,94,0.3); }
    .vote-red { background: rgba(239,68,68,0.2); border: 3px solid rgba(239,68,68,0.6); box-shadow: 0 0 30px rgba(239,68,68,0.3); }

    .tag { display: inline-block; padding: 6px 16px; background: rgba(78,203,255,0.15); border: 1px solid rgba(78,203,255,0.4); border-radius: 8px; font-size: 24px; color: #4ECBFF; margin-right: 12px; }
  </style>
</head>
<body>
<div id="root" data-composition-id="v2-reel-01" data-start="0" data-duration="20" data-width="1080" data-height="1920">
  <div class="bg"></div>
  <div class="grain"></div>
  <div class="flash" id="flash1"></div>
  <div class="safe">

    <!-- HOOK 0-3.5s -->
    <div class="clip" id="hook" data-start="0" data-duration="3.5" data-track-index="0">
      <div style="position:absolute; top:200px; left:0;">
        <div style="color:#fff; font-size:48px; font-weight:700;">お前の手札、</div>
        <div style="color:#FFE136; font-size:120px; font-weight:900; transform:rotate(-2deg); margin-top:20px;" class="fukuro">AA。</div>
      </div>
      <div style="position:absolute; top:80px; right:20px; font-size:100px; transform:rotate(15deg);">🃏</div>
    </div>

    <!-- SITUATION 3.5-7s -->
    <div class="clip" id="situation" data-start="3.5" data-duration="3.5" data-track-index="0">
      <div style="position:absolute; top:180px; left:0;">
        <div style="color:#fff; font-size:44px; font-weight:700;">UTGが5xオープン。</div>
        <div style="margin-top:30px;">
          <span style="color:#FF3B3B; font-size:64px; font-weight:900;">これ</span>
          <span style="color:#FFE136; font-size:64px; font-weight:900;">どうする？？</span>
        </div>
        <div style="margin-top:30px;">
          <span class="tag">NL200</span>
          <span class="tag">6max</span>
          <span class="tag">BTN</span>
        </div>
      </div>
    </div>

    <!-- VOTE 7-11s -->
    <div class="clip" id="vote" data-start="7" data-duration="4" data-track-index="0">
      <div style="position:absolute; top:250px; left:0; right:0; text-align:center;">
        <div style="display:flex; justify-content:center; gap:40px;">
          <div class="vote-btn vote-green" id="btn-4bet">4bet 👍</div>
          <div class="vote-btn vote-red" id="btn-call">コール 👎</div>
        </div>
        <div id="comment-text" style="color:#888; font-size:28px; margin-top:40px; opacity:0;">コメントで教えて</div>
      </div>
    </div>

    <!-- TRANSITION 11-13s -->
    <div class="clip" id="transition" data-start="11" data-duration="2" data-track-index="0">
      <div style="position:absolute; top:400px; left:0; right:0; text-align:center;">
        <div style="color:#fff; font-size:48px; font-weight:700;">正解は...</div>
      </div>
    </div>

    <!-- ANSWER 13-16.5s -->
    <div class="clip" id="answer" data-start="13" data-duration="3.5" data-track-index="0">
      <div style="position:absolute; top:200px; left:0; right:0; text-align:center;">
        <div id="answer-main">
          <span style="color:#FFE136; font-size:100px; font-weight:900;" class="fukuro">4bet</span>
          <span style="color:#fff; font-size:80px; font-weight:900;">一択。</span>
        </div>
        <div id="answer-detail" style="margin-top:50px; opacity:0;">
          <div style="color:#4ECBFF; font-size:32px;">コールだとSPR高すぎて</div>
          <div style="color:#4ECBFF; font-size:32px; margin-top:10px;">プリフロで値を取りきれ</div>
        </div>
      </div>
    </div>

    <!-- CTA 16.5-20s -->
    <div class="clip" id="cta" data-start="16.5" data-duration="3.5" data-track-index="0">
      <div style="position:absolute; top:300px; left:0; right:0; text-align:center;">
        <div id="cta-logo" style="color:#c9a84c; font-size:80px; font-weight:900; opacity:0;">PokerTALK</div>
        <div id="cta-tagline" style="color:#fff; font-size:32px; margin-top:30px; opacity:0;">テーブルの外でも、ポーカーを語ろう</div>
        <div id="cta-link" style="color:#888; font-size:24px; margin-top:30px; opacity:0;">↓ プロフのリンクから</div>
      </div>
    </div>

  </div>

  <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["v2-reel-01"] = tl;

    // Progress bar
    tl.to("#progress", { width: "100%", duration: 20, ease: "none" }, 0);

    // HOOK
    tl.to("#hook", { opacity: 1, duration: 0.3 }, 0);
    tl.to("#flash1", { opacity: 0.8, duration: 0.05 }, 0.8);
    tl.to("#flash1", { opacity: 0, duration: 0.15 }, 0.85);
    tl.to("#hook", { opacity: 0, duration: 0.3 }, 3.2);

    // SITUATION
    tl.to("#situation", { opacity: 1, duration: 0.3 }, 3.5);
    // screen shake
    tl.to("#situation", { x: 5, duration: 0.05, yoyo: true, repeat: 5 }, 5.0);
    tl.to("#situation", { x: 0, duration: 0.05 }, 5.3);
    tl.to("#situation", { opacity: 0, duration: 0.3 }, 6.7);

    // VOTE
    tl.to("#vote", { opacity: 1, duration: 0.3 }, 7);
    tl.to("#comment-text", { opacity: 1, duration: 0.5 }, 8);
    // pulse buttons
    tl.to("#btn-4bet", { scale: 1.05, duration: 0.6, yoyo: true, repeat: 3, ease: "sine.inOut" }, 7.3);
    tl.to("#btn-call", { scale: 1.05, duration: 0.6, yoyo: true, repeat: 3, ease: "sine.inOut" }, 7.5);
    tl.to("#vote", { opacity: 0, duration: 0.3 }, 10.7);

    // TRANSITION
    tl.to("#flash1", { opacity: 1, duration: 0.1 }, 11);
    tl.to("#flash1", { opacity: 0, duration: 0.1 }, 11.1);
    tl.to("#transition", { opacity: 1, duration: 0.3 }, 11.2);
    tl.to("#transition", { opacity: 0, duration: 0.3 }, 12.7);

    // ANSWER
    tl.to("#flash1", { opacity: 0.9, duration: 0.05 }, 13);
    tl.to("#flash1", { opacity: 0, duration: 0.2 }, 13.05);
    tl.to("#answer", { opacity: 1, duration: 0.2 }, 13);
    tl.fromTo("#answer-main", { scale: 1.5 }, { scale: 1, duration: 0.4, ease: "back.out(2)" }, 13);
    tl.to("#answer-detail", { opacity: 1, duration: 0.5 }, 14.2);
    tl.to("#answer", { opacity: 0, duration: 0.3 }, 16.2);

    // CTA
    tl.to("#cta", { opacity: 1, duration: 0.1 }, 16.5);
    tl.fromTo("#cta-logo", { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "elastic.out(1,0.5)" }, 16.5);
    tl.to("#cta-tagline", { opacity: 1, duration: 0.5 }, 17.0);
    tl.to("#cta-link", { opacity: 1, duration: 0.5 }, 18.0);
  </script>
</div>
</body>
</html>
