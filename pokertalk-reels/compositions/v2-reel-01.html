<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Inter:wght@400;700;900&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0a0d08; font-family: 'Noto Sans JP', sans-serif; }

    /* Grain overlay */
    .grain { position: absolute; inset: 0; opacity: 0.03; pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    /* TikTok safe zone: top 150px, bottom 250px, sides 60px */
    .safe { position: absolute; top: 150px; bottom: 250px; left: 60px; right: 60px; }

    .card { width: 180px; height: 260px; border-radius: 14px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; position: relative; overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 30px rgba(201,168,76,0.1);
      background: linear-gradient(145deg, #1a2318 0%, #0f150e 100%);
      border: 2px solid rgba(201,168,76,0.3); }
    .card::before { content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, transparent 50%); }
    .card-rank { font-size: 72px; font-weight: 900; line-height: 1; font-family: 'Inter', sans-serif; }
    .card-suit { font-size: 52px; line-height: 1; margin-top: 4px; }

    .glow-gold { text-shadow: 0 0 20px rgba(201,168,76,0.4), 0 0 40px rgba(201,168,76,0.2); }
    .glow-red { text-shadow: 0 0 20px rgba(192,57,43,0.4), 0 0 40px rgba(192,57,43,0.2); }

    .tag { display: inline-block; padding: 8px 20px; border-radius: 8px; font-size: 24px;
      font-weight: 700; background: rgba(201,168,76,0.1); border: 1px solid rgba(201,168,76,0.3);
      color: #c9a84c; margin: 4px; }

    .vote-btn { flex: 1; border-radius: 16px; padding: 28px 20px; text-align: center;
      backdrop-filter: blur(10px); transition: transform 0.2s; }
    .vote-good { background: rgba(76,175,80,0.08); border: 2px solid rgba(76,175,80,0.4); }
    .vote-bad { background: rgba(244,67,54,0.08); border: 2px solid rgba(244,67,54,0.4); }

    .progress-bar { position: absolute; bottom: 260px; left: 60px; right: 60px; height: 4px;
      background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; }
    .progress-fill { height: 100%; background: #c9a84c; border-radius: 2px; width: 0%; }

    .watermark { position: absolute; bottom: 270px; right: 60px; font-size: 20px;
      font-weight: 700; color: rgba(201,168,76,0.3); font-family: 'Inter', sans-serif;
      letter-spacing: 1px; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="v2-reel-01" data-start="0" data-duration="12" data-width="1080" data-height="1920">

    <!-- BG: Animated gradient -->
    <div id="bg" class="clip" data-start="0" data-duration="12" data-track-index="0"
      style="position:absolute;inset:0;">
      <div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%, rgba(201,168,76,0.06) 0%, transparent 50%);"></div>
      <div style="position:absolute;inset:0;background:radial-gradient(circle at 30% 70%, rgba(192,57,43,0.03) 0%, transparent 40%);"></div>
      <!-- Subtle animated line -->
      <div id="bg-line" style="position:absolute;top:50%;left:0;right:0;height:1px;background:linear-gradient(90deg, transparent 0%, rgba(201,168,76,0.15) 50%, transparent 100%);transform:scaleX(0);"></div>
    </div>

    <!-- Grain -->
    <div id="grain-layer" class="clip" data-start="0" data-duration="12" data-track-index="1"
      style="position:absolute;inset:0;"><div class="grain"></div></div>

    <!-- SCENE 1: HOOK (0-3s) -->
    <div id="scene1" class="clip" data-start="0" data-duration="3" data-track-index="2"
      style="position:absolute;inset:0;">
      <div class="safe" style="display:flex;flex-direction:column;align-items:center;justify-content:center;">
        <!-- Situation tag -->
        <div id="s1-tag" style="margin-bottom:32px;">
          <span class="tag" style="font-size:28px;">NL200 / 6max / BTN</span>
        </div>
        <!-- Main hook text -->
        <div id="s1-hook" style="text-align:center;">
          <p style="font-size:76px;font-weight:900;color:#ddd6c8;line-height:1.2;" class="glow-gold">
            UTGが5xオープン。
          </p>
          <p style="font-size:76px;font-weight:900;color:#c9a84c;line-height:1.2;margin-top:16px;" class="glow-gold">
            あなたはBTNでAA。
          </p>
        </div>
        <!-- Question -->
        <div id="s1-question" style="margin-top:48px;text-align:center;">
          <p style="font-size:56px;font-weight:900;color:#fff;letter-spacing:4px;">
            コール？ 4bet？
          </p>
        </div>
      </div>
    </div>

    <!-- SCENE 2: CARDS + SITUATION (3-7.5s) -->
    <div id="scene2" class="clip" data-start="3" data-duration="4.5" data-track-index="3"
      style="position:absolute;inset:0;">
      <div class="safe" style="display:flex;flex-direction:column;align-items:center;">
        <!-- Cards -->
        <div id="s2-cards" style="display:flex;gap:20px;margin-top:80px;">
          <div class="card" id="card-1">
            <span class="card-rank" style="color:#ddd6c8;">A</span>
            <span class="card-suit" style="color:#ddd6c8;">&#9824;</span>
          </div>
          <div class="card" id="card-2">
            <span class="card-rank" style="color:#c0392b;">A</span>
            <span class="card-suit" style="color:#c0392b;">&#9829;</span>
          </div>
        </div>

        <!-- Situation details -->
        <div id="s2-details" style="margin-top:60px;text-align:center;">
          <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:24px;">
            <span class="tag">Stack: 100bb</span>
            <span class="tag">UTG: タイト</span>
          </div>
          <p style="font-size:36px;color:#9a8e7a;line-height:1.5;">
            UTGのレンジは QQ+ AKs<br/>
            ここで何をする？
          </p>
        </div>

        <!-- Vote buttons -->
        <div id="s2-votes" style="display:flex;gap:24px;margin-top:60px;width:100%;max-width:800px;">
          <div class="vote-btn vote-good">
            <p style="font-size:56px;">👍</p>
            <p style="font-size:36px;font-weight:900;color:#4CAF50;margin-top:12px;">4bet</p>
            <p style="font-size:22px;color:rgba(76,175,80,0.7);margin-top:6px;">コメントで👍</p>
          </div>
          <div class="vote-btn vote-bad">
            <p style="font-size:56px;">👎</p>
            <p style="font-size:36px;font-weight:900;color:#f44336;margin-top:12px;">コール</p>
            <p style="font-size:22px;color:rgba(244,67,54,0.7);margin-top:6px;">コメントで👎</p>
          </div>
        </div>
      </div>
    </div>

    <!-- SCENE 3: ANSWER (7.5-10.5s) -->
    <div id="scene3" class="clip" data-start="7.5" data-duration="3" data-track-index="4"
      style="position:absolute;inset:0;">
      <div class="safe" style="display:flex;flex-direction:column;align-items:center;justify-content:center;">
        <!-- Answer badge -->
        <div id="s3-badge" style="background:#c9a84c;border-radius:12px;padding:12px 32px;margin-bottom:32px;">
          <p style="font-size:28px;font-weight:900;color:#0a0d08;letter-spacing:2px;">ANSWER</p>
        </div>
        <!-- Main answer -->
        <div id="s3-answer" style="text-align:center;">
          <p style="font-size:72px;font-weight:900;color:#c9a84c;" class="glow-gold">4bet 一択。</p>
        </div>
        <!-- Reason -->
        <div id="s3-reason" style="margin-top:40px;text-align:center;max-width:800px;">
          <p style="font-size:34px;color:#9a8e7a;line-height:1.6;">
            AAでコールするとSPRが高くなり<br/>
            ポストフロップの判断が複雑化する。<br/>
            <span style="color:#ddd6c8;font-weight:700;">プリフロで値を取りきるのが正解。</span>
          </p>
        </div>
      </div>
    </div>

    <!-- SCENE 4: CTA (10.5-12s) -->
    <div id="scene4" class="clip" data-start="10.5" data-duration="1.5" data-track-index="5"
      style="position:absolute;inset:0;">
      <div class="safe" style="display:flex;flex-direction:column;align-items:center;justify-content:center;">
        <div id="s4-cta" style="text-align:center;">
          <p style="font-size:32px;color:#6b7a66;">ハンドを語れる場所</p>
          <p style="font-size:80px;font-weight:900;color:#c9a84c;margin-top:12px;letter-spacing:2px;font-family:'Inter',sans-serif;" class="glow-gold">PokerTALK</p>
          <p style="font-size:28px;color:#6b7a66;margin-top:16px;">↓ プロフのリンクから</p>
        </div>
      </div>
    </div>

    <!-- Progress bar -->
    <div id="progress" class="clip" data-start="0" data-duration="12" data-track-index="6"
      style="position:absolute;inset:0;pointer-events:none;">
      <div class="progress-bar"><div class="progress-fill" id="prog-fill"></div></div>
    </div>

    <!-- Watermark -->
    <div id="wm" class="clip" data-start="0" data-duration="12" data-track-index="7"
      style="position:absolute;inset:0;pointer-events:none;">
      <div class="watermark">PokerTALK</div>
    </div>

    <!-- Flash transition overlays -->
    <div id="flash1" class="clip" data-start="2.8" data-duration="0.4" data-track-index="8"
      style="position:absolute;inset:0;background:#c9a84c;opacity:0;pointer-events:none;"></div>
    <div id="flash2" class="clip" data-start="7.3" data-duration="0.4" data-track-index="9"
      style="position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;"></div>
    <div id="flash3" class="clip" data-start="10.3" data-duration="0.4" data-track-index="10"
      style="position:absolute;inset:0;background:#c9a84c;opacity:0;pointer-events:none;"></div>

  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // BG ambient animation
    tl.to("#bg-line", { scaleX: 1, duration: 2, ease: "power2.out" }, 0);
    tl.to("#bg-line", { opacity: 0, duration: 1 }, 2);

    // SCENE 1: Hook entrance (0-3s)
    tl.from("#s1-tag", { opacity: 0, y: -20, duration: 0.4, ease: "power3.out" }, 0.2);
    tl.from("#s1-hook p:first-child", { opacity: 0, x: -40, duration: 0.5, ease: "power4.out" }, 0.5);
    tl.from("#s1-hook p:last-child", { opacity: 0, x: 40, duration: 0.5, ease: "power4.out" }, 0.8);
    tl.from("#s1-question", { opacity: 0, scale: 0.8, duration: 0.4, ease: "back.out(2)" }, 1.4);
    // Pulse the question
    tl.to("#s1-question", { scale: 1.05, duration: 0.3, yoyo: true, repeat: 2, ease: "power1.inOut" }, 1.8);

    // Flash transition 1
    tl.to("#flash1", { opacity: 0.6, duration: 0.1, ease: "power4.in" }, 2.9);
    tl.to("#flash1", { opacity: 0, duration: 0.2, ease: "power2.out" }, 3.0);

    // SCENE 2: Cards + Vote (3-7.5s)
    tl.from("#card-1", { opacity: 0, rotationY: 180, x: -60, duration: 0.6, ease: "power4.out" }, 3.1);
    tl.from("#card-2", { opacity: 0, rotationY: 180, x: 60, duration: 0.6, ease: "power4.out" }, 3.3);
    // Card glow pulse
    tl.to("#s2-cards .card", { boxShadow: "0 20px 60px rgba(0,0,0,0.8), 0 0 50px rgba(201,168,76,0.3)", duration: 0.5, yoyo: true, repeat: 1 }, 3.8);
    tl.from("#s2-details", { opacity: 0, y: 30, duration: 0.5, ease: "power3.out" }, 4.0);
    tl.from("#s2-details .tag", { opacity: 0, scale: 0.8, stagger: 0.15, duration: 0.3, ease: "back.out(2)" }, 4.2);
    tl.from("#s2-votes", { opacity: 0, y: 50, duration: 0.6, ease: "power3.out" }, 4.8);
    tl.from("#s2-votes .vote-good", { x: -30, duration: 0.4, ease: "power3.out" }, 5.0);
    tl.from("#s2-votes .vote-bad", { x: 30, duration: 0.4, ease: "power3.out" }, 5.0);
    // Pulse vote buttons
    tl.to("#s2-votes .vote-good", { scale: 1.03, duration: 0.4, yoyo: true, repeat: 2, ease: "power1.inOut" }, 5.8);
    tl.to("#s2-votes .vote-bad", { scale: 1.03, duration: 0.4, yoyo: true, repeat: 2, ease: "power1.inOut" }, 6.0);

    // Flash transition 2
    tl.to("#flash2", { opacity: 0.7, duration: 0.1, ease: "power4.in" }, 7.4);
    tl.to("#flash2", { opacity: 0, duration: 0.2, ease: "power2.out" }, 7.5);

    // SCENE 3: Answer (7.5-10.5s)
    tl.from("#s3-badge", { opacity: 0, scale: 0, duration: 0.4, ease: "back.out(3)" }, 7.6);
    tl.from("#s3-answer", { opacity: 0, scale: 1.3, duration: 0.5, ease: "power4.out" }, 7.9);
    tl.from("#s3-reason", { opacity: 0, y: 30, duration: 0.6, ease: "power3.out" }, 8.4);
    tl.from("#s3-reason span", { color: "#9a8e7a", duration: 0.5 }, 9.0);

    // Flash transition 3
    tl.to("#flash3", { opacity: 0.5, duration: 0.1, ease: "power4.in" }, 10.4);
    tl.to("#flash3", { opacity: 0, duration: 0.2, ease: "power2.out" }, 10.5);

    // SCENE 4: CTA (10.5-12s)
    tl.from("#s4-cta p:nth-child(1)", { opacity: 0, y: 20, duration: 0.3, ease: "power3.out" }, 10.6);
    tl.from("#s4-cta p:nth-child(2)", { opacity: 0, scale: 0.7, duration: 0.5, ease: "elastic.out(1, 0.5)" }, 10.8);
    tl.from("#s4-cta p:nth-child(3)", { opacity: 0, duration: 0.3 }, 11.3);

    // Progress bar animation (entire duration)
    tl.to("#prog-fill", { width: "100%", duration: 12, ease: "none" }, 0);

    window.__timelines["v2-reel-01"] = tl;
  </script>
</body>
</html>
